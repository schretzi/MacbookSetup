[defaults]
inventory = inventory.yml
roles_path = roles
# Readable multi-line output. `stdout_callback = yaml` was the old way and was
# removed from community.general 12.
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent
retry_files_enabled = False
nocows = True

[privilege_escalation]
# Roles that need root (unbound, java, kanata log rotation) use `become: true`.
# Run the playbook with --ask-become-pass, or configure passwordless sudo.
become_ask_pass = True
