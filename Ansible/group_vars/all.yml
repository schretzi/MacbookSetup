---
# ============================================================================
# MacbookSetup - central switchboard
# ============================================================================
# Every topic below can be turned off independently. A role only runs when its
# `enable_*` flag is true.
#
#   Run everything that is enabled here:
#       ansible-playbook site.yml --ask-become-pass
#   Run one topic ad-hoc (still honours the flag):
#       ansible-playbook site.yml --tags unbound
#   Force a topic that is disabled here:
#       ansible-playbook site.yml --tags mail -e enable_mail=true
#   Run everything except one topic:
#       ansible-playbook site.yml --skip-tags mail
# ============================================================================

# Root of this repository - the single source of truth for every config file.
repo_root: "{{ playbook_dir | dirname }}"

# ---------------------------------------------------------------------------
# Overlay repositories
# ---------------------------------------------------------------------------
# This repository is the publishable base - all machinery, no identity. Two
# optional private repositories layer on top:
#
#   private   personal identity: mail accounts, signing keys, home DNS zones
#   work      employer-specific: work mail account, intranet DNS, work aliases
#
# Set a path to enable an overlay; leave it empty and the overlay is simply
# absent. An overlay may provide:
#   <root>/identity.yml   personal identity (private overlay only)
#   <root>/overlay.yml    extra dotfile links, Brewfiles, AdGuard Home zones,
#                         mail accounts
# Anything it ships lives under <root>/Dotfiles, <root>/Brewfiles and so on,
# mirroring this repository's layout.
private_repo_root: "{{ ansible_facts.env.HOME }}/Workspace/Schretzi/MacbookSetup-Private"
work_repo_root: "{{ ansible_facts.env.HOME }}/Workspace/Schretzi/MacbookSetup-Work"

# Fallback identity when no private overlay is cloned. This is the staging
# copy that the private overlay will eventually take over from.
identity_file: "{{ playbook_dir }}/local/identity.yml"

# Homebrew prefix: /opt/homebrew on Apple Silicon, /usr/local on Intel. Taken
# from the architecture rather than hardcoded, so the same play also converges
# the old Intel MacBook Air (see Ansible/profiles/travel.yml).
homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts.architecture == 'arm64' else '/usr/local' }}"

# schretzi.net (and everything under it, e.g. kiac.schretzi.net) must always
# resolve via unbound, even on a VPN whose client overrides the system
# default resolver (see roles/unbound/defaults/main.yml for why that needs a
# domain-scoped /etc/resolver entry rather than relying on networksetup's
# per-service resolver order).
unbound_resolver_domains:
  - schretzi.net

# ---------------------------------------------------------------------------
# Topic switches
# ---------------------------------------------------------------------------

# ~/bin, ~/tmp, ~/Workspace ...
enable_base_dirs: true

# brew bundle for the Brewfiles selected in roles/homebrew/defaults/main.yml
enable_homebrew: true

# Python CLIs installed with `uv tool install` rather than from a Brewfile -
# see roles/uv_tools/defaults/main.yml for the list and for which way round
# the brew-vs-uv decision goes.
enable_uv_tools: true

# Symlink ~/.config/* and the home dotfiles back into Dotfiles/
enable_dotfiles: true

# neovim from the pinned official release tarball, linked as ~/.local/bin/nvim
# - for machines without a Homebrew bottle (the Intel Air). Off here: the
# Apple Silicon machines take neovim from 00_base.brew. See
# roles/neovim_release/defaults/main.yml.
enable_neovim_release: false

# ~/.gitconfig, ~/.config/git/* + signing setup
enable_git: true

# ~/.ssh/config, ~/.ssh/allowed_signers, directory permissions
enable_ssh: true

# Renders ~/.config/gitlab/instances.yaml for the `gl` shell function, which
# switches glab's active host/token in the current shell. Hostnames come from
# gitlab_instances, contributed by the private and work overlays - empty here.
enable_gitlab: true

# ~/.kube/configs, for kubeconfig-add/kubeconfig-merge (see Setup.md ->
# Kubernetes). Per-cluster subdirectories and their contents are never
# touched by this repo - you create and populate them by hand.
enable_kubeconfig: true

# How sudo authenticates: Touch ID (/etc/pam.d/sudo_local), a credential
# cache shared across terminals, and the passwordless (NOPASSWD) rules - see
# roles/sudoers/defaults/main.yml for the rule list and every knob.
#
#   sudoers_passwordless_enabled: false  refuses passwordless sudo altogether
#     without disabling the role - existing rule files are removed and every
#     affected command prompts through plain `sudo` instead.
#   sudoers_touchid_enabled: true        writes /etc/pam.d/sudo_local so the
#     fingerprint answers sudo. Off: Touch ID never authenticates here, and
#     the file makes --ask-become-pass runs throw a password panel per root
#     task. See Setup.md -> "sudo".
#   sudoers_shared_timestamp: true       one credential cache for all
#     terminals, which is what would let a single `sudo -v` cover a whole
#     `ansible-playbook` run instead of --ask-become-pass. Off, because that
#     is only worth its security cost once Touch ID actually authenticates -
#     and on this machine it does not yet. See Setup.md -> "sudo".
enable_sudoers: true
sudoers_passwordless_enabled: true
sudoers_touchid_enabled: false
sudoers_shared_timestamp: false

# Link the Homebrew JDK into /Library/Java/JavaVirtualMachines  (needs sudo)
enable_java: true

# kanata build with `cmd` feature, LaunchDaemon, log rotation  (needs sudo)
enable_kanata: true

# yabai + skhd LaunchAgents
enable_windowmanager: true

# sketchybar LaunchAgent: desktop strip + gtt running-timer widget
enable_statusbar: true

# offlineimap/notmuch/neomutt/msmtp/omt config + sync LaunchAgents
enable_mail: true

# Local copy of the notes vault, rclone bisync with Nextcloud from a
# LaunchAgent. For offline machines; the M5 mounts the vault over WebDAV.
enable_notes_sync: false

# The extra 127.0.0.x addresses on lo0 (needs sudo). Every local resolver
# binds one, because mDNSResponder already owns 127.0.0.1:53 - AdGuard Home
# uses 127.0.0.3 for both DNS and its web UI, and the cluster zones answer
# with .3 to .12. macOS forgets them on reboot, so a LaunchDaemon recreates
# them. Deliberately independent of which resolver is switched on below.
enable_localhost_alias: true

# unbound, the resolver this machine runs: makes sure the brew-managed
# service is running, renders unbound.conf, and installs the local zones
# and forward-zone overlays into conf.d/.
#
# false means "do not manage", not "remove" - the daemon and its conf.d/ are
# left exactly as they are.
enable_unbound: true

# Docker Desktop's proxy settings (settings-store.json), autostart, and the
# kiac root CA in ~/.docker/certs.d - the replacement for apple/container
# (see roles/docker_desktop/defaults/main.yml for why). Needs local_ca to
# have already issued a root, and the docker cask installed - warns and
# skips itself otherwise.
enable_docker_desktop: true


# Trusts locally-generated root CAs (added via `security add-trusted-cert`
# into /Library/Keychains/System.keychain) in Firefox-based browsers too -
# Firefox/NSS ignores the System keychain by default, unlike Safari/Chrome.
# (needs sudo)
enable_firefox_enterprise_roots: true

# The machine's own CA: the root in ~/.local/share/localca, its trust in the
# System keychain, and the intermediates issued from it. It used to live in
# LocalKubernetes' roles/host_ca, which meant a machine without that checkout
# could not create one - and privoxy needs one too. (needs sudo, once, to
# trust anything new)
enable_local_ca: true

# CA certificates this machine did not create itself - typically an
# employer's internal root, contributed via `trusted_cas_certs` (see
# roles/trusted_cas/defaults/main.yml). Trusted into the System keychain the
# same way local_ca trusts its own root, and picked up by privoxy's bundle
# from there. Empty by default: nothing to trust until an overlay adds
# entries. (needs sudo, once per certificate, to trust anything new)
enable_trusted_cas: true

# Intermediates beyond the per-cluster ones LocalKubernetes issues.
#
# privoxy signs its on-the-fly site certificates with this one, and never
# touches the root key. trust_as_root is required rather than cosmetic:
# privoxy sends only the leaf, so the issuer must already be an anchor on the
# client - see Setup.md -> "Filtering proxy".
local_ca_intermediates:
  - name: privoxy
    common_name: Privoxy HTTPS Inspection CA
    trust_as_root: true
  # Signs the certificates of services that run on this machine and are
  # reached over HTTPS. No trust_as_root here, and that is the difference
  # worth seeing: an ordinary TLS server sends leaf + intermediate, so the
  # client chains up to the root it already trusts. privoxy needs the extra
  # trust only because it can send a leaf and nothing else.
  - name: services
    common_name: Local Services Intermediate CA

# HTTPS certificates for local services, issued from those intermediates.
local_ca_server_certs: []

# privoxy, the filtering HTTP proxy alpaca forwards to in direct contexts:
# ~/.config/privoxy, the LaunchAgent, log rotation and the PAC that puts it
# in alpaca's path. The CA it needs is created by
# Scripts/MacOS/privoxy_ca_init.sh, not by the play.
enable_privoxy: true

# macswitcher network contexts: ~/.config/macswitcher, the shell proxy
# variables in ~/.zsh/rcs/proxy - all seeded once, then owned by the runtime
enable_macswitcher: true

# kerberoskeepalive's LaunchAgent and log rotation (the binary itself comes
# from the homebrew role)
enable_kerberoskeepalive: true

# tunneling's LaunchAgent and log rotation. No cask yet - the role warns and
# skips unless the binary has been installed from its repo (`make install`).
enable_tunneling: true

# gcloud components
enable_gcloud: true

# Shared AI skills (Claude / Copilot / anything reading ~/.agents/skills) plus
# the assistant configs worth versioning
enable_ai: true

# ollama's LaunchAgent and its log rotation. Registered at login but never
# started on its own - a loaded model holds several GB, so it is a per-session
# thing driven from `macswitcher observe` or the `ollama_service` shell
# function. The binary itself comes from the homebrew role.
enable_ollama: true

# Employer-specific configuration, supplied by the work overlay.
# This also gates the work mail account: with it off, msmtp/notmuch/offlineimap
# are rendered without it entirely.
enable_work: true

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------
# Names, addresses, mail accounts and signing keys live in `identity_file`
# above, not here - that is what keeps this file publishable.
