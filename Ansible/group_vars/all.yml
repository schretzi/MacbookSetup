---
# ============================================================================
# MacbookSetup - central switchboard
# ============================================================================
# Every topic below can be turned off independently. A role only runs when its
# `enable_*` flag is true.
#
#   Run everything that is enabled here:
#       ansible-playbook site.yml --ask-become-pass
#   Run one topic ad-hoc (still honours the flag):
#       ansible-playbook site.yml --tags unbound
#   Force a topic that is disabled here:
#       ansible-playbook site.yml --tags unbound -e enable_unbound=true
#   Run everything except one topic:
#       ansible-playbook site.yml --skip-tags mail
# ============================================================================

# Root of this repository - the single source of truth for every config file.
repo_root: "{{ playbook_dir | dirname }}"

# ---------------------------------------------------------------------------
# Overlay repositories
# ---------------------------------------------------------------------------
# This repository is the publishable base - all machinery, no identity. Two
# optional private repositories layer on top:
#
#   private   personal identity: mail accounts, signing keys, home DNS zones
#   work      employer-specific: work mail account, intranet DNS, work aliases
#
# Set a path to enable an overlay; leave it empty and the overlay is simply
# absent. An overlay may provide:
#   <root>/identity.yml   personal identity (private overlay only)
#   <root>/overlay.yml    extra dotfile links, Brewfiles, unbound profiles,
#                         mail accounts
# Anything it ships lives under <root>/Dotfiles, <root>/Brewfiles and so on,
# mirroring this repository's layout.
private_repo_root: "{{ ansible_facts.env.HOME }}/Workspace/Schretzi/MacbookSetup-Private"
work_repo_root: "{{ ansible_facts.env.HOME }}/Workspace/Schretzi/MacbookSetup-Work"

# Fallback identity when no private overlay is cloned. This is the staging
# copy that the private overlay will eventually take over from.
identity_file: "{{ playbook_dir }}/local/identity.yml"

# Homebrew prefix (Apple Silicon). Intel Macs would use /usr/local.
homebrew_prefix: /opt/homebrew

# ---------------------------------------------------------------------------
# Topic switches
# ---------------------------------------------------------------------------

# ~/bin, ~/tmp, ~/Workspace ...
enable_base_dirs: true

# brew bundle for the Brewfiles selected in roles/homebrew/defaults/main.yml
enable_homebrew: true

# Symlink ~/.config/* and the home dotfiles back into Dotfiles/
enable_dotfiles: true

# ~/.gitconfig, ~/.config/git/* + signing setup
enable_git: true

# ~/.ssh/config, ~/.ssh/allowed_signers, directory permissions
enable_ssh: true

# Renders ~/.config/gitlab/instances.yaml for the `gl` shell function, which
# switches glab's active host/token in the current shell. Hostnames come from
# gitlab_instances, contributed by the private and work overlays - empty here.
enable_gitlab: true

# ~/.kube/configs, for kubeconfig-add/kubeconfig-merge (see Setup.md ->
# Kubernetes). Per-cluster subdirectories and their contents are never
# touched by this repo - you create and populate them by hand.
enable_kubeconfig: true

# How sudo authenticates: Touch ID (/etc/pam.d/sudo_local), a credential
# cache shared across terminals, and the passwordless (NOPASSWD) rules - see
# roles/sudoers/defaults/main.yml for the rule list and every knob.
#
#   sudoers_passwordless_enabled: false  refuses passwordless sudo altogether
#     without disabling the role - existing rule files are removed and every
#     affected command prompts through plain `sudo` instead.
#   sudoers_touchid_enabled: true        writes /etc/pam.d/sudo_local so the
#     fingerprint answers sudo. Off: Touch ID never authenticates here, and
#     the file makes --ask-become-pass runs throw a password panel per root
#     task. See Setup.md -> "sudo".
#   sudoers_shared_timestamp: true       one credential cache for all
#     terminals, which is what would let a single `sudo -v` cover a whole
#     `ansible-playbook` run instead of --ask-become-pass. Off, because that
#     is only worth its security cost once Touch ID actually authenticates -
#     and on this machine it does not yet. See Setup.md -> "sudo".
enable_sudoers: true
sudoers_passwordless_enabled: true
sudoers_touchid_enabled: false
sudoers_shared_timestamp: false

# Link the Homebrew JDK into /Library/Java/JavaVirtualMachines  (needs sudo)
enable_java: true

# kanata build with `cmd` feature, LaunchDaemon, log rotation  (needs sudo)
enable_kanata: true

# yabai + skhd LaunchAgents
enable_windowmanager: true

# offlineimap/notmuch/neomutt/msmtp/omt config + sync LaunchAgents
enable_mail: true

# unbound resolver: loopback aliases, _unbound user, configs, LaunchDaemon
# (needs sudo)
enable_unbound: true

# pf NAT for LocalKubernetes' (kiac) vmnet subnet, kept pointed at whichever
# interface currently owns the default route (Wi-Fi/Ethernet/VPN switches)
# (needs sudo). Only meaningful on machines running kiac clusters — safe to
# leave enabled elsewhere, it just NATs a private subnet nothing else uses.
enable_pf_vmnet_nat: true

# Trusts locally-generated root CAs (added via `security add-trusted-cert`
# into /Library/Keychains/System.keychain) in Firefox-based browsers too -
# Firefox/NSS ignores the System keychain by default, unlike Safari/Chrome.
# (needs sudo)
enable_firefox_enterprise_roots: true

# macswitcher network contexts: ~/.config/macswitcher, the shell proxy
# variables in ~/.zsh/rcs/proxy - all seeded once, then owned by the runtime
enable_macswitcher: true

# gcloud components
enable_gcloud: true

# Shared AI skills (Claude / Copilot / anything reading ~/.agents/skills) plus
# the assistant configs worth versioning
enable_ai: true

# Employer-specific configuration, supplied by the work overlay.
# This also gates the work mail account: with it off, msmtp/notmuch/offlineimap
# are rendered without it entirely.
enable_work: true

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------
# Names, addresses, mail accounts and signing keys live in `identity_file`
# above, not here - that is what keeps this file publishable.
