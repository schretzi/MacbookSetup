---
# roles/container_autostart — bring the container runtime and its service
# containers back after a boot, and refresh DNS when an address changed.
#
# The full reasoning lives in Scripts/MacOS/container_autostart.py; the short
# version is that three things are broken after a reboot and only one of them
# was automated before: the API server's own plist is registered outside
# ~/Library/LaunchAgents so launchd never loads it, apple/container has no
# restart policy, and every container's vmnet address is new.

- name: Container autostart | install the autostart script
  ansible.builtin.copy:
    src: "{{ repo_root }}/Scripts/MacOS/container_autostart.py"
    dest: /usr/local/bin/container_autostart
    owner: root
    group: wheel
    mode: "0755"
  become: true

# An Agent, not a Daemon: apple/container's API server is itself a per-user
# agent in gui/<uid>, the containers belong to that user, and the DNS refresh
# runs against the user's ~/.kube/config. Root has none of those.
- name: Container autostart | install the LaunchAgent
  ansible.builtin.include_role:
    name: launchd
    tasks_from: agent
  vars:
    launchd_plist: com.schretzi.container-autostart.plist
    launchd_label: com.schretzi.container-autostart

- name: Container autostart | rotate its logs
  ansible.builtin.include_role:
    name: newsyslog
  vars:
    newsyslog_conf: container-autostart.conf

# Not a failure: the containers still come back without it, and a machine
# without the LocalKubernetes checkout has no zone to render in the first
# place. But a stale zone is the kind of thing that is noticed hours later, as
# a name that resolves to an address nothing answers on, so say it out loud.
- name: Container autostart | check for the DNS refresh wrapper
  ansible.builtin.stat:
    path: "{{ container_autostart_dns_wrapper }}"
  register: container_autostart_wrapper_state

- name: Container autostart | warn when the DNS refresh wrapper is missing
  ansible.builtin.debug:
    msg: >-
      {{ container_autostart_dns_wrapper }} is not installed, so containers
      will be started but the AdGuard Home zone will keep its previous
      addresses. Run LocalKubernetes' playbooks/site.yml (role host_prereqs)
      to install it.
  when: not container_autostart_wrapper_state.stat.exists
