---
# Verify a CLI actually implements the current LaunchAgent convention before a
# role calls `<bin> service install`.
#
# Three of my CLIs render and load their own plist rather than shipping one in
# this repo, which means the *installed binary* is what decides the label and
# log paths. That introduces two failure modes, and the second is silent:
#
#   - The installed build predates `service` entirely. The call fails with a
#     cobra usage dump that never mentions the real problem ("accepts 1 arg(s),
#     received 2").
#   - The installed build has an *older* `service` that still writes the
#     pre-convention label and per-project log directory. The call SUCCEEDS and
#     quietly installs the wrong plist - a green playbook run that leaves the
#     machine unmigrated.
#
# So this asserts on the label the binary actually reports, not merely on
# whether the subcommand exists.
#
# Caller must set:
#   launchd_service_cli_bin:   "{{ homebrew_prefix }}/bin/omt"
#   launchd_service_cli_label: com.schretzi.omt

- name: "Launchd | probe for service support: {{ launchd_service_cli_bin | basename }}"
  ansible.builtin.command: "{{ launchd_service_cli_bin }} service status"
  register: launchd_service_cli_probe
  changed_when: false
  check_mode: false
  failed_when: false

- name: "Launchd | require the current service convention from {{ launchd_service_cli_bin | basename }}"
  ansible.builtin.assert:
    that:
      - launchd_service_cli_probe.rc == 0
      - launchd_service_cli_label in (launchd_service_cli_probe.stdout | default(''))
    success_msg: >-
      {{ launchd_service_cli_bin | basename }} implements {{ launchd_service_cli_label }}
    fail_msg: >-
      {{ launchd_service_cli_bin }} does not implement the current LaunchAgent
      convention: `service status` was expected to report
      "{{ launchd_service_cli_label }}" and did not.

      This is an outdated build. Either it has no `service` command at all, or
      it has an older one that would still install the pre-convention label -
      which would look like success and leave the machine unmigrated.

      Upgrade the binary first (`brew upgrade --cask
      {{ launchd_service_cli_bin | basename }}`, or build and install from its repo),
      then re-run. See MacbookSetup/CONVENTIONS.md.

- name: "Launchd | forget probe variables"
  ansible.builtin.set_fact:
    launchd_service_cli_probe: null
