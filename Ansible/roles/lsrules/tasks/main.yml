---
# lsrules - serves the Little Snitch rule groups over HTTPS.
#
# The binary comes from Brewfiles/60_security.brew (cask schretzi/tap/lsrules),
# so this role only owns the parts brew does not: the LaunchAgent and its log
# rotation. There is no plist for it in this repo - lsrules renders and loads
# its own from internal/service, exactly like macswitcher, omt and
# kerberoskeepalive.
#
# The certificate it serves with is issued by the local_ca role, which is why
# that one runs first in site.yml.

- name: Lsrules | check the binary is installed
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/lsrules"
  register: lsrules_binary
  changed_when: false
  check_mode: false

- name: Lsrules | warn when the cask is missing
  ansible.builtin.debug:
    msg: >-
      lsrules is not installed at {{ homebrew_prefix }}/bin/lsrules - run the
      homebrew role first (cask schretzi/tap/lsrules). Skipping the
      LaunchAgent.
  when: not lsrules_binary.stat.exists

- name: Lsrules | configure
  when: lsrules_binary.stat.exists
  block:
    # Seeded, then owned by the runtime: `lsrules config init` writes it and
    # the file is a human's afterwards. Ansible only makes sure it exists,
    # because `service install` refuses to install against a config that does
    # not validate - which is the right behaviour and a confusing failure if
    # the file is simply absent.
    - name: Lsrules | look for the configuration
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.config/lsrules/config.yaml"
      register: lsrules_config

    - name: Lsrules | seed the configuration
      ansible.builtin.command:
        cmd: "{{ homebrew_prefix }}/bin/lsrules config init"
      when: not lsrules_config.stat.exists
      changed_when: true

    # Says what is wrong - a missing certificate, a rules directory that is
    # not there - instead of letting `service install` fail with less context.
    - name: Lsrules | validate the configuration
      ansible.builtin.command:
        cmd: "{{ homebrew_prefix }}/bin/lsrules config validate"
      register: lsrules_validate
      changed_when: false
      failed_when: false

    - name: Lsrules | warn when the configuration does not validate
      ansible.builtin.debug:
        msg: >-
          lsrules config validate failed:
          {{ lsrules_validate.stderr | default(lsrules_validate.stdout) | trim }}
      when: lsrules_validate.rc != 0

    - name: Lsrules | require a build that implements the current convention
      ansible.builtin.include_role:
        name: launchd
        tasks_from: require_service_cli
      vars:
        launchd_service_cli_bin: "{{ homebrew_prefix }}/bin/lsrules"
        launchd_service_cli_label: com.schretzi.lsrules
      when: lsrules_validate.rc == 0

    - name: Lsrules | install the LaunchAgent
      ansible.builtin.command:
        cmd: "{{ homebrew_prefix }}/bin/lsrules service install"
      register: lsrules_service
      changed_when: "'installed and started' in lsrules_service.stdout"
      when: lsrules_validate.rc == 0

    - name: Lsrules | rotate its logs
      ansible.builtin.include_role:
        name: newsyslog
      vars:
        newsyslog_conf: lsrules.conf
