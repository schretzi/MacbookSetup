---
# macswitcher - macOS network contexts, DNS and proxy wiring.
#
# The binary comes from the schretzi/tap/macswitcher cask (Brewfiles/00_base.brew).
#
# Everything this role touches is *runtime-owned*: macswitcher rewrites
# config.yaml, the context files and ~/.zsh/rcs/proxy in place whenever it
# switches context. Ansible therefore SEEDS them (copy, force: false) instead
# of linking them. This is the same lesson as dotfiles_real_dirs and as the
# unbound role's forwarders.conf: a symlink here means the runtime writes its
# values straight back into the source tree.

- name: Macswitcher | check the binary is present
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/macswitcher"
  register: macswitcher_bin

- name: Macswitcher | warn when macswitcher is missing
  ansible.builtin.debug:
    msg: >-
      {{ homebrew_prefix }}/bin/macswitcher not found. Install it with
      `brew install --cask schretzi/tap/macswitcher` - skipping this role.
  when: not macswitcher_bin.stat.exists

- name: Macswitcher | configure
  when: macswitcher_bin.stat.exists
  block:
    # ----------------------------------------------------------------------
    # One-time migration: earlier runs linked these back into the repos
    # ----------------------------------------------------------------------
    - name: Macswitcher | inspect the paths that must not be links
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ macswitcher_config_dir }}"
        - "{{ macswitcher_config_dir }}/config.yaml"
        - "{{ ansible_facts.env.HOME }}/{{ macswitcher_proxy_rc_dest }}"
      register: macswitcher_link_state

    - name: Macswitcher | drop symlinks left by the old link-based setup
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: absent
      loop: "{{ macswitcher_link_state.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.islnk | default(false)

    # ----------------------------------------------------------------------
    # Real directories, then the global config
    # ----------------------------------------------------------------------
    - name: Macswitcher | create the configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ macswitcher_config_dir }}"
        - "{{ macswitcher_config_dir }}/contexts"

    # force: false - macswitcher rewrites this file, so it is seeded once and
    # the live copy wins from then on.
    - name: Macswitcher | seed the global configuration
      ansible.builtin.copy:
        src: "{{ repo_root }}/{{ macswitcher_config_src }}"
        dest: "{{ macswitcher_config_dir }}/config.yaml"
        mode: "0644"
        force: false

    # ----------------------------------------------------------------------
    # Contexts, contributed by the overlays
    # ----------------------------------------------------------------------
    - name: Macswitcher | inspect the overlay context sources
      ansible.builtin.stat:
        path: "{{ (item.root | default(repo_root)) ~ '/' ~ item.src }}"
      loop: "{{ macswitcher_contexts_overlay }}"
      loop_control:
        label: "{{ item.name }}"
      register: macswitcher_context_sources

    - name: Macswitcher | seed the overlay contexts
      ansible.builtin.copy:
        src: "{{ item.stat.path }}"
        dest: "{{ macswitcher_config_dir }}/contexts/{{ item.item.name }}.yaml"
        mode: "0644"
        force: false
      loop: "{{ macswitcher_context_sources.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item.name }}"

    # ----------------------------------------------------------------------
    # No overlay contexts at all - let macswitcher render its own templates
    # ----------------------------------------------------------------------
    - name: Macswitcher | look for context files
      ansible.builtin.find:
        paths: "{{ macswitcher_config_dir }}/contexts"
        patterns: "*.yaml"
      register: macswitcher_contexts_present

    # `macswitcher config init` refuses to run when a config.yaml already
    # exists ("error: config already exists"), and it writes config.yaml,
    # state.json and the starter contexts together. Rendering into a throwaway
    # directory is the only way to get the context templates without letting it
    # overwrite the global config this repo owns.
    - name: Macswitcher | render starter contexts when no overlay supplied any
      when: macswitcher_contexts_present.matched | int == 0
      block:
        - name: Macswitcher | create a scratch directory for the templates
          ansible.builtin.tempfile:
            state: directory
            suffix: macswitcher-init
          register: macswitcher_scratch

        - name: Macswitcher | render the starter templates
          ansible.builtin.command:
            cmd: >-
              {{ homebrew_prefix }}/bin/macswitcher
              --config {{ macswitcher_scratch.path }}/config.yaml config init
          changed_when: true

        - name: Macswitcher | collect the rendered contexts
          ansible.builtin.find:
            paths: "{{ macswitcher_scratch.path }}/contexts"
            patterns: "*.yaml"
          register: macswitcher_rendered

        - name: Macswitcher | install the rendered contexts
          ansible.builtin.copy:
            src: "{{ item.path }}"
            dest: "{{ macswitcher_config_dir }}/contexts/{{ item.path | basename }}"
            mode: "0644"
            remote_src: true
            force: false
          loop: "{{ macswitcher_rendered.files }}"
          loop_control:
            label: "{{ item.path | basename }}"
          register: macswitcher_installed

        # `config init` fills mac_network_location from the first line of
        # `scselect`, which is its header - "Defined sets include: (* == current
        # set)" - rather than a location name. Switching to that would fail, so
        # blank it out and let the location be filled in deliberately. Only
        # files this run actually created are touched.
        - name: Macswitcher | repair the bogus network location in rendered contexts
          ansible.builtin.replace:
            path: "{{ item.dest }}"
            regexp: '^mac_network_location:.*Defined sets include.*$'
            replace: 'mac_network_location: ""'
          loop: "{{ macswitcher_installed.results | selectattr('changed') | list }}"
          loop_control:
            label: "{{ item.dest | basename }}"
      always:
        - name: Macswitcher | discard the scratch directory
          ansible.builtin.file:
            path: "{{ macswitcher_scratch.path }}"
            state: absent
          when: macswitcher_scratch.path is defined

    # ----------------------------------------------------------------------
    # Shell proxy variables
    # ----------------------------------------------------------------------
    - name: Macswitcher | create the zsh rc directory
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/{{ macswitcher_proxy_rc_dest | dirname }}"
        state: directory
        mode: "0755"

    - name: Macswitcher | seed the shell proxy variables
      ansible.builtin.copy:
        src: "{{ repo_root }}/{{ macswitcher_proxy_rc_src }}"
        dest: "{{ ansible_facts.env.HOME }}/{{ macswitcher_proxy_rc_dest }}"
        mode: "0644"
        force: false

    # ----------------------------------------------------------------------
    # Prove the result is loadable rather than merely present
    # ----------------------------------------------------------------------
    - name: Macswitcher | validate the configuration
      ansible.builtin.command:
        cmd: "{{ homebrew_prefix }}/bin/macswitcher config validate"
      register: macswitcher_validate
      changed_when: false
      failed_when: false

    - name: Macswitcher | warn when the configuration does not validate
      ansible.builtin.debug:
        msg: >-
          macswitcher config validate failed:
          {{ macswitcher_validate.stderr | default(macswitcher_validate.stdout) | trim }}
      when: macswitcher_validate.rc != 0

    # ----------------------------------------------------------------------
    # LaunchAgent
    # ----------------------------------------------------------------------
    # macswitcher renders and loads its own plist from internal/service, so
    # there is no plist for it in this repo. `service install` is idempotent:
    # it reinstalls and reloads, which is also how a plist change is applied.
    # macswitcher has had a `service` command since before the convention, and
    # the older one installs com.macswitcher.proxy quite happily - it would
    # report success and leave the machine unmigrated. So check the label the
    # binary reports, not just that the subcommand exists.
    - name: Macswitcher | require a macswitcher that implements the current convention
      ansible.builtin.include_role:
        name: launchd
        tasks_from: require_service_cli
      vars:
        service_cli_bin: "{{ homebrew_prefix }}/bin/macswitcher"
        service_cli_label: com.schretzi.macswitcher
      when: macswitcher_validate.rc == 0

    - name: Macswitcher | install the LaunchAgent
      ansible.builtin.command:
        cmd: "{{ homebrew_prefix }}/bin/macswitcher service install"
      register: macswitcher_service
      changed_when: "'installed and started' in macswitcher_service.stdout"
      when: macswitcher_validate.rc == 0

    - name: Macswitcher | rotate its logs
      ansible.builtin.include_role:
        name: newsyslog
      vars:
        newsyslog_conf: macswitcher.conf
