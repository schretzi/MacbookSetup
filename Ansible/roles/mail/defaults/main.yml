---
# Must match [database] path in Dotfiles/notmuch/.notmuch-config and the
# localfolders in Dotfiles/offlineimap/.config/offlineimap/.
mail_maildir: "{{ ansible_facts.env.HOME }}/Maildir"

# Home directory baked into the rendered muttrc.
mail_home: "{{ ansible_facts.env.HOME }}"

# Shared neomutt files, symlinked into ~/.config/mutt. Everything else in that
# directory is either rendered (muttrc) or generated by offlineimap
# (muttrc.mailboxes). `accounts` is a directory of per-account configs.
mail_mutt_static_files:
  - neo.muttrc
  - switch.muttrc
  - bulk-handling-patterns.muttrc
  - mailcap
  - openfile

# --- omt (OAuth token manager) -------------------------------------------
mail_omt_debug: true
mail_omt_daemon_interval: 5m
mail_omt_default_authflow: localhostauthcode

# Provider definitions - endpoints only, no credentials. Generic and
# non-personal, so these belong in the public base repo.
#
# The OAuth application credentials (client_id/client_secret) are deliberately
# NOT here: they are supplied as mail_oauth_clients from identity_file. They
# are Thunderbird's published credentials rather than personal secrets, but a
# literal `client_secret:` in a public repository trips secret scanners and
# GitHub push protection, so they stay out of this tree.
#
# `scope` is written as a plain string; the template JSON-quotes every value on
# the way out, which is valid YAML and safely handles the [ ] ? : characters in
# the Microsoft secret and the empty consumer secret.
mail_omt_providers:
  google:
    authorize_endpoint: https://accounts.google.com/o/oauth2/auth
    devicecode_endpoint: https://oauth2.googleapis.com/device/code
    token_endpoint: https://accounts.google.com/o/oauth2/token
    redirect_uri: urn:ietf:wg:oauth:2.0:oob
    imap_endpoint: imap.gmail.com
    pop_endpoint: pop.gmail.com
    smtp_endpoint: smtp.gmail.com
    sasl_method: OAUTHBEARER
    scope: https://mail.google.com/
  o365:
    authorize_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    devicecode_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/devicecode
    token_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/token
    redirect_uri: https://login.microsoftonline.com/common/oauth2/nativeclient
    tenant: common
    imap_endpoint: outlook.office365.com
    pop_endpoint: outlook.office365.com
    smtp_endpoint: smtp.office365.com
    sasl_method: XOAUTH2
    scope: >-
      offline_access https://outlook.office.com/IMAP.AccessAsUser.All
      https://outlook.office.com/POP.AccessAsUser.All
      https://outlook.office.com/SMTP.Send
  o365-consumers:
    authorize_endpoint: https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize
    devicecode_endpoint: https://login.microsoftonline.com/consumers/oauth2/v2.0/devicecode
    token_endpoint: https://login.microsoftonline.com/consumers/oauth2/v2.0/token
    redirect_uri: https://login.microsoftonline.com/common/oauth2/nativeclient
    tenant: consumers
    imap_endpoint: outlook.office365.com
    pop_endpoint: outlook.office365.com
    smtp_endpoint: smtp.office365.com
    sasl_method: XOAUTH2
    scope: >-
      offline_access https://outlook.office.com/IMAP.AccessAsUser.All
      https://outlook.office.com/POP.AccessAsUser.All
      https://outlook.office.com/SMTP.Send

# OAuth application credentials, keyed by provider name.
#
# Empty by default: they are read from the macOS keychain at run time (see the
# mail role), so no repository - public or private - carries the literals.
# GitHub push protection rejects Google OAuth client id/secret patterns, which
# makes a file-based approach unpushable regardless of how private the repo is.
# An overlay may still set this explicitly and that takes precedence.
#
# Populate the keychain with: Scripts/omt-oauth-keychain.sh store <provider> <id> <secret>
mail_oauth_clients: {}
mail_oauth_keychain_service: "MacbookSetup omt oauth"

# offlineimap tunables, shared by every account.
mail_offlineimap_maxsyncaccounts: 1
mail_offlineimap_ui: basic
mail_offlineimap_cacertfile: "{{ homebrew_prefix }}/etc/ca-certificates/cert.pem"

# Mail accounts contributed by the work overlay. Merged into the effective
# account list only when enable_work is true.
mail_work_accounts: []
