---
# roles/pf_vmnet_nat — keeps LocalKubernetes' cluster node VMs (and their
# pods, via Cilium masquerade) able to reach the internet regardless of
# which physical interface currently owns the default route (Wi-Fi vs.
# wired Ethernet vs. VPN) — see Scripts/MacOS/vmnet_nat_refresh.sh for the
# full story.
#
# Chain: pf anchor hook in /etc/pf.conf -> refresh script -> LaunchDaemon
# that re-runs the script on every network change -> sudoers rule for
# manual on-demand refresh.

- name: pf_vmnet_nat | install the NAT interface refresh script
  ansible.builtin.copy:
    src: "{{ repo_root }}/Scripts/MacOS/vmnet_nat_refresh.sh"
    dest: /usr/local/bin/vmnet_nat_refresh
    owner: root
    group: wheel
    mode: "0755"
  become: true
  when: pf_vmnet_nat_enabled | bool

# Placeholder anchor file so /etc/pf.conf's `load anchor` below never
# fails to find it — the refresh script (or its LaunchDaemon) overwrites
# this with the real interface-specific rule the first time it runs.
- name: pf_vmnet_nat | ensure a placeholder anchor file exists
  ansible.builtin.copy:
    dest: /etc/pf.anchors/com.kiac.vmnet-nat
    content: |
      # Placeholder — overwritten by vmnet_nat_refresh (roles/pf_vmnet_nat)
      # with the real "nat on <iface> from 192.168.64.0/24 to any -> (<iface>)"
      # rule the first time it runs. Empty here on purpose: pf refuses to
      # load /etc/pf.conf if a `load anchor` target file is missing.
    force: false # never clobber a real rule the script already wrote
    owner: root
    group: wheel
    mode: "0644"
  become: true
  when: pf_vmnet_nat_enabled | bool

# Hook the anchor into the main ruleset, directly after com.apple's own
# nat-anchor line — pf enforces strict ordering (options, normalization,
# queueing, translation, filtering), so this must land in the translation
# section, before any filtering anchor such as com.apple's later
# rdr-anchor/anchor lines.
- name: pf_vmnet_nat | hook the anchor into /etc/pf.conf
  ansible.builtin.blockinfile:
    path: /etc/pf.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK - pf_vmnet_nat"
    insertafter: '^nat-anchor "com.apple/\*"$'
    block: |
      nat-anchor "com.kiac.vmnet-nat"
      load anchor "com.kiac.vmnet-nat" from "/etc/pf.anchors/com.kiac.vmnet-nat"
  become: true
  register: pf_vmnet_nat_conf
  when: pf_vmnet_nat_enabled | bool

- name: pf_vmnet_nat | install the LaunchDaemon that refreshes NAT on network changes
  ansible.builtin.include_role:
    name: launchd
    tasks_from: daemon
  vars:
    launchd_plist: com.kiac.vmnet-nat-refresh.plist
    launchd_label: com.kiac.vmnet-nat-refresh
  when: pf_vmnet_nat_enabled | bool

- name: pf_vmnet_nat | reload pf with the new ruleset now
  ansible.builtin.command: /sbin/pfctl -f /etc/pf.conf
  become: true
  when: pf_vmnet_nat_enabled | bool and pf_vmnet_nat_conf.changed
  changed_when: true

- name: pf_vmnet_nat | run the refresh script now so NAT is correct immediately
  ansible.builtin.command: /usr/local/bin/vmnet_nat_refresh
  become: true
  when: pf_vmnet_nat_enabled | bool
  register: pf_vmnet_nat_refresh_run
  changed_when: "'NAT now via' in pf_vmnet_nat_refresh_run.stdout"
