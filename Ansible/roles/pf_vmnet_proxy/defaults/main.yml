---
# Only meaningful on machines running LocalKubernetes (kiac) clusters and
# macswitcher's Alpaca proxy. The vmnet subnet/interface are defined there
# (LocalKubernetes/inventory/group_vars/all/main.yml: vmnet_subnet,
# vmnet_interface) — duplicated here as literals rather than
# cross-repo-templated, same rationale as roles/pf_vmnet_nat: this role has
# no dependency on that repo being checked out. Keep both in sync by hand
# if the vmnet is ever renumbered (PLAN.md §2, §9 #7).
pf_vmnet_proxy_enabled: true
vmnet_subnet: 192.168.64.0/24
vmnet_interface: bridge100

# Must match macswitcher's local_proxy.host/port
# (~/.config/macswitcher/config.yaml) — Alpaca always listens on loopback
# only (never on the vmnet gateway directly, see PLAN.md §7.3 "Option B"),
# so this rdr rule is what actually makes it reachable from the vmnet.
pf_vmnet_proxy_upstream_host: 127.0.0.1
pf_vmnet_proxy_upstream_port: 3128
