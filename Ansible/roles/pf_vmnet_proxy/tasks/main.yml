---
# roles/pf_vmnet_proxy — makes macswitcher's Alpaca proxy (loopback-only,
# Kerberos-authenticated, see PLAN.md §7.3 in LocalKubernetes) reachable from
# LocalKubernetes' cluster node VMs and host containers, without ever
# exposing it off-host.
#
# Problem: Alpaca binds 127.0.0.1 only. 127.0.0.1 inside a container/VM is
# that guest's own loopback, not the Mac's — so pointing HTTP_PROXY at
# 127.0.0.1:3128 from inside a node VM does nothing. Binding Alpaca itself to
# the vmnet gateway (192.168.64.1) was considered and rejected (PLAN.md §7.3
# "Option A" vs "Option B"): Alpaca refuses to start on an address that isn't
# currently up, and bridge100 only exists while a container/VM is running —
# the same trap AdGuard Home's bind list hit and worked around with a
# refresh script. Unlike AdGuard Home, Alpaca carries live Kerberos
# credentials, so "just bind 0.0.0.0" is not an acceptable trade — it would
# be an open proxy forwarding your identity to whoever finds it.
#
# Fix ("Option B"): a static pf `rdr` rule that only ever runs on the host,
# translating "vmnet guest -> gateway:3128" to "loopback:3128" in the
# kernel. Alpaca itself never has to know the vmnet exists. Because this
# rule matches on the *source* subnet and *destination port*, not on
# bridge100 actually being up, pf accepts it even while bridge100 doesn't
# exist yet (same as any other rule referencing a dynamic interface) — no
# refresh script needed, unlike roles/pf_vmnet_nat's NAT rule, which has to
# track whichever *physical* interface currently owns the default route.
#
# Chain: pf anchor hook in /etc/pf.conf (this role) -> kernel rdr, no
# daemon involved. Node VMs/containers then reach the proxy at
# 192.168.64.1:3128 (see LocalKubernetes' proxy_url).

- name: PF vmnet proxy | render the proxy redirect anchor file
  ansible.builtin.copy:
    dest: /etc/pf.anchors/com.kiac.vmnet-proxy
    content: |
      # Managed by Ansible (roles/pf_vmnet_proxy) — do not edit by hand.
      #
      # Redirects TCP connections from the kiac vmnet subnet, addressed to
      # the vmnet gateway's own IP on the Alpaca proxy port, to Alpaca's
      # actual loopback-only listener. Alpaca is never exposed off-host:
      # only traffic already inside the vmnet (i.e. already inside this
      # Mac's own container runtime) can reach it this way.
      rdr pass on {{ pf_vmnet_proxy_interface }} proto tcp \
        from {{ pf_vmnet_proxy_subnet }} to ({{ pf_vmnet_proxy_interface }}) port {{ pf_vmnet_proxy_upstream_port }} \
        -> {{ pf_vmnet_proxy_upstream_host }} port {{ pf_vmnet_proxy_upstream_port }}
    owner: root
    group: wheel
    mode: "0644"
  become: true
  register: pf_vmnet_proxy_anchor
  when: pf_vmnet_proxy_enabled | bool

# Hook the anchor into the main ruleset. rdr is a translation rule, so it
# must land before any filtering anchor — com.apple's own rdr-anchor line
# is the natural landmark, mirroring how roles/pf_vmnet_nat hooks its
# nat-anchor directly after com.apple's nat-anchor line.
- name: PF vmnet proxy | hook the anchor into /etc/pf.conf
  ansible.builtin.blockinfile:
    path: /etc/pf.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK - pf_vmnet_proxy"
    insertafter: '^rdr-anchor "com.apple/\*"$'
    block: |
      rdr-anchor "com.kiac.vmnet-proxy"
      load anchor "com.kiac.vmnet-proxy" from "/etc/pf.anchors/com.kiac.vmnet-proxy"
  become: true
  register: pf_vmnet_proxy_conf
  when: pf_vmnet_proxy_enabled | bool

- name: PF vmnet proxy | reload pf with the new ruleset now
  ansible.builtin.command: /sbin/pfctl -f /etc/pf.conf
  become: true
  when: >
    pf_vmnet_proxy_enabled | bool and
    (pf_vmnet_proxy_conf.changed or pf_vmnet_proxy_anchor.changed)
  changed_when: true

- name: PF vmnet proxy | make sure pf itself is enabled
  ansible.builtin.command: /sbin/pfctl -e
  become: true
  register: pf_vmnet_proxy_enable
  failed_when: >
    pf_vmnet_proxy_enable.rc != 0 and
    'already enabled' not in pf_vmnet_proxy_enable.stderr
  changed_when: "'already enabled' not in pf_vmnet_proxy_enable.stderr"
  when: pf_vmnet_proxy_enabled | bool
