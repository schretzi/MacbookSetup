---
# privoxy - the filtering HTTP proxy alpaca forwards to in direct contexts.
#
# The binary comes from schretzi/tap/privoxy (Brewfiles/60_security.brew),
# NOT from homebrew-core: core's bottle is built without --with-openssl, so
# FEATURE_HTTPS_INSPECTION is compiled out and every ca-* directive in the
# config is ignored with a log line and nothing else. A privoxy that silently
# does not inspect looks exactly like one that does, which is why this role
# refuses to configure the core build rather than warning about it.

- name: Privoxy | check the binary is present
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/sbin/privoxy"
  register: privoxy_bin

- name: Privoxy | warn when privoxy is missing
  ansible.builtin.debug:
    msg: >-
      {{ homebrew_prefix }}/sbin/privoxy not found. Install it with
      `brew install schretzi/tap/privoxy` - skipping this role.
  when: not privoxy_bin.stat.exists

- name: Privoxy | configure
  when: privoxy_bin.stat.exists
  block:
    # ----------------------------------------------------------------------
    # The build has to be the one with HTTPS inspection
    # ----------------------------------------------------------------------
    # A privoxy without it links no TLS library at all, so this is a question
    # otool can answer without starting anything.
    - name: Privoxy | check the build links a TLS library
      ansible.builtin.command: "otool -L {{ homebrew_prefix }}/sbin/privoxy"
      register: privoxy_otool
      changed_when: false
      check_mode: false

    - name: Privoxy | require a build with HTTPS inspection
      ansible.builtin.assert:
        that: "'libssl' in privoxy_otool.stdout"
        fail_msg: >-
          {{ homebrew_prefix }}/sbin/privoxy is built without OpenSSL, so it
          has no HTTPS inspection: it would ignore every ca-* directive and
          filter nothing but plain HTTP. This is homebrew-core's bottle.
          Replace it with the tap build:
            brew uninstall privoxy && brew install schretzi/tap/privoxy
        success_msg: "privoxy links OpenSSL - HTTPS inspection is available"

    # ----------------------------------------------------------------------
    # Directories
    # ----------------------------------------------------------------------
    - name: Privoxy | create the configuration directory
      ansible.builtin.file:
        path: "{{ privoxy_config_dir }}"
        state: directory
        mode: "0755"

    # State, per CONVENTIONS.md 2a: the generated leaf certificates and the
    # trusted-CA bundle are both safe to delete, and both are rewritten by
    # whatever needs them next.
    - name: Privoxy | create the state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ privoxy_state_dir }}"
        - "{{ privoxy_state_dir }}/certs"

    # ----------------------------------------------------------------------
    # The root store privoxy verifies upstream servers against
    # ----------------------------------------------------------------------
    # privoxy becomes the TLS client once inspection is on and it never looks
    # at the macOS keychain. Homebrew's ca-certificates covers the public web;
    # the keychain roots are what make locally-signed hosts (LocalKubernetes'
    # host CA, anything added with `security add-trusted-cert`) keep working
    # through the proxy instead of failing verification.
    - name: Privoxy | collect the machine's trusted roots
      ansible.builtin.command: "security find-certificate -a -p {{ item }}"
      register: privoxy_keychain_roots
      changed_when: false
      check_mode: false
      loop: "{{ privoxy_system_keychains }}"

    - name: Privoxy | read Homebrew's ca-certificates bundle
      ansible.builtin.slurp:
        src: "{{ privoxy_ca_certificates_bundle }}"
      register: privoxy_brew_bundle

    # Belt and suspenders on top of the keychain scan above: a certificate
    # trusted the ordinary way (`security add-trusted-cert -k
    # System.keychain ...`, what the trusted_cas role does) is already caught
    # by that scan. This reads roles/trusted_cas' own files directly, so a
    # certificate that ends up trusted some other way (imported through the
    # Keychain Access GUI, which defaults to the *login* keychain - the
    # keychain scan above never reads that one) still reaches privoxy.
    - name: Privoxy | check for externally trusted CA certificates
      ansible.builtin.stat:
        path: "{{ privoxy_extra_trusted_cas_dir }}"
      register: privoxy_extra_trusted_cas_stat
      changed_when: false
      check_mode: false

    - name: Privoxy | list externally trusted CA certificates
      ansible.builtin.find:
        paths: "{{ privoxy_extra_trusted_cas_dir }}"
        patterns: "*.crt"
      register: privoxy_extra_trusted_cas
      when: privoxy_extra_trusted_cas_stat.stat.isdir | default(false)
      changed_when: false
      check_mode: false

    - name: Privoxy | read the externally trusted CA certificates
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: privoxy_extra_trusted_cas_content
      loop: "{{ privoxy_extra_trusted_cas.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Privoxy | assemble the trusted-CA bundle
      ansible.builtin.copy:
        content: |
          # Generated by MacbookSetup's privoxy role - do not edit.
          # Homebrew ca-certificates + this machine's keychain roots.
          {{ privoxy_brew_bundle.content | b64decode }}
          {% for result in privoxy_keychain_roots.results %}
          # ---- {{ result.item }} ----
          {{ result.stdout }}
          {% endfor %}
          {% for result in privoxy_extra_trusted_cas_content.results | default([]) %}
          # ---- {{ result.item.path | basename }} (roles/trusted_cas) ----
          {{ result.content | b64decode }}
          {% endfor %}
        dest: "{{ privoxy_trusted_cas_file }}"
        mode: "0644"

    # ----------------------------------------------------------------------
    # Configuration and rules
    # ----------------------------------------------------------------------
    # force (the default) on all three: privoxy never writes these, so the
    # repository stays the source of truth. This is the opposite of the
    # macswitcher role, and for the opposite reason.
    - name: Privoxy | install the configuration
      ansible.builtin.template:
        src: config.j2
        dest: "{{ privoxy_config_dir }}/config"
        mode: "0644"
      register: privoxy_config

    - name: Privoxy | install the action and filter files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ privoxy_config_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - user.action
        - user.filter
      register: privoxy_rules

    # ----------------------------------------------------------------------
    # The CA, which this role only ever checks for
    # ----------------------------------------------------------------------
    - name: Privoxy | look for the signing CA
      ansible.builtin.stat:
        path: "{{ privoxy_ca_dir }}/{{ privoxy_ca_cert_file }}"
      register: privoxy_ca

    # The local_ca role issues and trusts it; this role only consumes it.
    # Until it exists privoxy starts and proxies plain HTTP, but every HTTPS
    # request dies in generate_host_certificate(), so say so rather than let
    # it look like a network fault.
    - name: Privoxy | explain the missing signing CA
      ansible.builtin.debug:
        msg: >-
          No signing CA at {{ privoxy_ca_dir }}/{{ privoxy_ca_cert_file }}.
          HTTPS through privoxy fails until it exists - run
          `ansible-playbook site.yml --tags local_ca --ask-become-pass`.
      when: not privoxy_ca.stat.exists

    # A re-issued intermediate invalidates every site certificate privoxy
    # minted under the previous one: privoxy reuses whatever is already in
    # certificate-directory and would keep serving leaves the client can no
    # longer verify. Cheap to fix, expensive to debug - one regeneration per
    # site is the entire cost of clearing them.
    - name: Privoxy | drop site certificates older than the signing CA
      ansible.builtin.shell:
        cmd: >-
          find {{ privoxy_state_dir }}/certs -type f
          ! -newer {{ privoxy_ca_dir }}/{{ privoxy_ca_cert_file }} -delete
      register: privoxy_stale_certs
      changed_when: false
      when: privoxy_ca.stat.exists

    # ----------------------------------------------------------------------
    # LaunchAgent and rotation
    # ----------------------------------------------------------------------
    - name: Privoxy | install the LaunchAgent
      ansible.builtin.include_role:
        name: launchd
        tasks_from: agent
      vars:
        launchd_plist: "{{ privoxy_plist }}"
        launchd_label: "{{ privoxy_label }}"

    - name: Privoxy | rotate its logs
      ansible.builtin.include_role:
        name: newsyslog
      vars:
        newsyslog_conf: privoxy.conf

    # A config or rule change is only real once the running process has read
    # it. SIGHUP is privoxy's reload (jcc.c:382 sets received_hup_signal, and
    # the main loop acts on it), so it costs no dropped connections - unlike
    # kickstart -k. It does not reopen the log here; that path is gated on the
    # `logfile` directive, which foreground privoxy never has. Log rotation
    # therefore signals 15 instead - see etc/newsyslog.d/privoxy.conf.
    - name: Privoxy | reload after a configuration change
      ansible.builtin.command: "pkill -HUP -f '{{ homebrew_prefix }}/sbin/privoxy'"
      when: privoxy_config.changed or privoxy_rules.changed # noqa: no-handler
      changed_when: true
      failed_when: false
