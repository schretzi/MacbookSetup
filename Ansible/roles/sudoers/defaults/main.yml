---
# Central switchboard for passwordless sudo.
#
# Every NOPASSWD rule the user needs — for shell aliases like `flush_dns` or
# for other roles that shell out to a root command at runtime — is declared
# here as one entry, instead of being scattered across each role's tasks.
# That keeps everything a user can run as root without a password prompt
# auditable in a single file.
#
# Each entry becomes its own file under /etc/sudoers.d/<name>:
#   - name: a short, unique identifier; also the destination filename
#   - comment: why this rule exists (rendered into the file for auditing)
#   - commands: absolute paths only - sudoers wildcards are not supported
sudoers_rules:
  # macswitcher rewrites unbound's forwarders file on every context switch,
  # and unbound reads conf.d/ at startup only - it has no reload signal of
  # its own. Without this rule the switch prompts for a password from a
  # LaunchAgent that has no terminal, i.e. it silently keeps serving the
  # previous network's resolvers.
  #
  # bootout/bootstrap, not just kickstart: macswitcher's config.yaml
  # daemons.unbound start/stop/restart_command overrides (for `macswitcher
  # observe`'s own restart action) call all three verbs directly, the same
  # reason kanata-service below lists all three rather than relying on `sudo`
  # to prompt.
  - name: unbound-service
    comment: start/stop/restart unbound (macswitcher context switches and observe; unbound has no reload signal)
    commands:
      - /bin/launchctl bootstrap system /Library/LaunchDaemons/sh.brew.unbound.plist
      - /bin/launchctl bootout system /Library/LaunchDaemons/sh.brew.unbound.plist
      - /bin/launchctl kickstart -k system/sh.brew.unbound

  - name: unbound-zones-refresh
    comment: make unbound re-read conf.d/ after LocalKubernetes re-renders kiac.conf, or an overlay zone changes
    commands:
      - /usr/local/bin/unbound_zones_refresh

  # Every launchctl verb `macswitcher observe` needs for kanata, plus the one
  # the kanata_restart alias uses. They live in one rule because they are one
  # concern - the daemon's lifecycle - and splitting them would mean two files
  # to audit for the same privilege.
  #
  # Why bootout/bootstrap and not `launchctl stop`: the plist sets KeepAlive,
  # so a stopped-but-loaded job is restarted at once. Worse, com.schretzi.kanata-wake
  # kickstarts the daemon on every system wake and guards only on `launchctl
  # print` - which still succeeds for a loaded job - so a `stop` would be
  # silently undone the next time the lid opens. bootout unloads the job, the
  # guard then fails, and the stop survives sleep/wake. A reboot brings kanata
  # back, which for a keymapper is the wanted safety net.
  #
  # Why these need to be listed at all, given `sudo` would prompt anyway:
  # macswitcher's generic system-scope path builds `sudo sh -c "launchctl ..."`,
  # and sudo then matches on /bin/sh, which no rule here can name. The daemons
  # entry in macswitcher's config.yaml therefore uses explicit start/stop/
  # restart_command overrides that call /bin/launchctl directly - those are the
  # command lines below.
  #
  # Note this grants root to whoever can write ~/.cargo/bin/kanata, since that
  # is what the plist execs. That is not new - the kickstart rule already did -
  # and it is called out in plists/LaunchDaemon/com.kanata.daemon.plist.j2.
  # Moving the binary to a root-owned /usr/local/bin would close it.
  - name: kanata-service
    comment: start/stop/restart the kanata daemon (macswitcher observe, kanata_restart alias)
    commands:
      - /bin/launchctl bootout system /Library/LaunchDaemons/com.kanata.daemon.plist
      - /bin/launchctl bootstrap system /Library/LaunchDaemons/com.kanata.daemon.plist
      - /bin/launchctl kickstart -k system/com.kanata.daemon

  - name: dns-flush
    comment: flush macOS's system DNS resolver cache (flush_dns alias)
    commands:
      - /usr/bin/dscacheutil -flushcache
      - /usr/bin/killall -HUP mDNSResponder

  - name: openconnect
    comment: start openconnect VPN app
    commands:
      - /opt/homebrew/bin/openconnect


# Names of rule files this role used to manage and must now delete.
#
# The install task only ever writes the files named in sudoers_rules, and the
# cleanup task above only removes those same names - so renaming or dropping an
# entry leaves its old file behind, still granting NOPASSWD, indefinitely. For
# a file whose only purpose is granting privilege, "left behind" is the one
# outcome that must not be possible.
#
# An entry stays here until every machine has run the role at least once;
# removing a path that is already gone is a no-op.
sudoers_rules_removed:
  # Folded into kanata-service, which also covers bootout/bootstrap.
  - kanata-restart
  # kiac/apple-container decommissioned - LocalKubernetes moved to Docker
  # Compose, which needs neither the vmnet gateway rebind nor its NAT
  # refresh.
  - adguardhome-bind-refresh
  - vmnet-nat-refresh
  # AdGuard Home removed entirely - replaced by unbound-service and
  # unbound-zones-refresh above.
  - adguardhome-restart
  - adguardhome-zones-refresh

# Master switch: set to false to refuse passwordless sudo entirely. Any
# rule files this role previously installed are removed and none are
# (re)created; every command in sudoers_rules then falls back to a normal
# password prompt through `sudo`.
sudoers_passwordless_enabled: true

# ---------------------------------------------------------------------------
# Touch ID
# ---------------------------------------------------------------------------
# Authenticate `sudo` with the fingerprint sensor instead of the login
# password, by writing /etc/pam.d/sudo_local (the include Apple provides for
# exactly this and preserves across system updates). Turning this off removes
# that file again, which is the stock macOS state.
#
# Falling back is automatic and unconditional: whenever the sensor is not
# available or the caller cannot prompt, sudo asks for the password as before.
#
# Off, and not because of the fallback - because on this machine Touch ID for
# sudo never authenticates at all (Setup.md -> "sudo") while the file still
# has a price. Ansible drops sudo's `-n` flag as soon as a become password is
# supplied, so under --ask-become-pass every single `become: true` task runs
# the full interactive PAM stack: pam_tid engages, cannot authenticate, and
# authd throws a password panel on screen. One popup per root task, for
# nothing. Flip back to true when the OS side works.
sudoers_touchid_enabled: false

# Only relevant inside tmux/screen: those detach the PAM session from the GUI
# login session, so pam_tid has nowhere to show its dialog and Touch ID just
# does nothing. pam_reattach fixes it - `brew install pam-reattach` first, the
# role refuses to render a reference to a module that is not there. Off here
# because kitty is the only terminal on this machine and needs none of it.
sudoers_touchid_pam_reattach: false

# ---------------------------------------------------------------------------
# Credential cache
# ---------------------------------------------------------------------------
# Share one sudo credential cache across all terminals (/etc/sudoers.d/
# 00-timestamp) rather than sudo's default of one per tty. Verified to work:
# with it on, a `sudo -v` typed in a shell is usable by the sudo calls
# Ansible's become makes from its own tty-less children, so one
# authentication covers a whole run instead of --ask-become-pass.
#
# Off all the same. The point of it was to spend one Touch ID instead of
# typing a password, and Touch ID for sudo does not authenticate on this
# machine (Setup.md -> "sudo"). Trading a wider sudo window for "type the
# password once instead of once" is not worth it, so this waits for the
# Touch ID side to work. On: the rule file is installed; off: it is removed.
sudoers_shared_timestamp: false

# Minutes the cache stays valid, counted from the authentication - measured,
# not assumed: a `sudo` that consumes the cache does not push the deadline
# back. So this has to cover the *whole* stretch from `sudo -v` to the last
# root task of a run, not just the gap between two of them. site.yml reaches
# its first root task only after homebrew, which on a cold machine can take
# longer than this; use --ask-become-pass for those runs.
sudoers_timestamp_timeout: 20

# kitty sets TERMINFO to its own bundled terminfo directory so it works
# without the kitty-terminfo package being installed system-wide. sudo's
# default env_reset strips (and, if explicitly re-set, refuses) TERM and
# TERMINFO, which breaks any `sudo`/Ansible-become command run from a kitty
# window ("sudo: sorry, you are not allowed to set the following
# environment variables: TERMINFO"). Keeping both fixes it - see
# https://sw.kovidgoyal.net/kitty/faq/#i-get-errors-about-the-terminal-being-unknown-or-opening-the-terminal-failing-or-functional-keys-like-arrow-keys-don-t-work
sudoers_env_keep:
  - TERM
  - TERMINFO
