---
# Everything about how sudo authenticates on this machine lives here: the
# passwordless (NOPASSWD) rules, how sudo caches credentials, and whether
# Touch ID answers the prompt.
#
# One rule file per entry in sudoers_rules (see defaults/main.yml) - the
# single place every passwordless (NOPASSWD) sudo rule is declared and
# audited, instead of scattered across whichever role happens to need one.
#
# sudoers_passwordless_enabled: false refuses passwordless sudo altogether:
# any previously installed rule files are removed and none are (re)created,
# so every command in sudoers_rules falls back to a normal `sudo` prompt.

- name: Sudoers | ensure the sudoers include directory exists
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: true

- name: Sudoers | remove managed rule files when passwordless sudo is disabled
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}"
    state: absent
  loop: "{{ sudoers_rules }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  when: not (sudoers_passwordless_enabled | bool)

# Deliberately not gated on sudoers_passwordless_enabled: a rule that should
# be gone should be gone either way. Gating it would mean the only run that
# deletes a withdrawn rule is one that also switches passwordless sudo off.
- name: Sudoers | remove rule files that are no longer declared
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item }}"
    state: absent
  loop: "{{ sudoers_rules_removed | default([]) }}"
  become: true

- name: Sudoers | install passwordless rule files
  ansible.builtin.template:
    src: rule.j2
    dest: "/etc/sudoers.d/{{ item.name }}"
    owner: root
    group: wheel
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  loop: "{{ sudoers_rules }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  when: sudoers_passwordless_enabled | bool

# Independent of sudoers_passwordless_enabled: this only makes sudo preserve
# TERM/TERMINFO (needed for kitty), it grants no extra privileges, so it
# stays installed even when passwordless sudo is switched off.
- name: Sudoers | install the env_keep rule for kitty's TERMINFO
  ansible.builtin.template:
    src: env_keep.j2
    dest: /etc/sudoers.d/00-env-keep
    owner: root
    group: wheel
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  become: true

# ---------------------------------------------------------------------------
# Credential cache
# ---------------------------------------------------------------------------
# sudo caches an authentication per terminal by default. Ansible escalates
# from child processes that have no tty at all, so under that default each
# `become: true` task authenticates on its own - and no amount of Touch ID in
# the shell beforehand helps. A shared cache makes one `sudo -v` cover the run.

- name: Sudoers | share one credential cache across terminals
  ansible.builtin.template:
    src: timestamp.j2
    dest: /etc/sudoers.d/00-timestamp
    owner: root
    group: wheel
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  become: true
  when: sudoers_shared_timestamp | bool

- name: Sudoers | restore sudo's per-terminal credential cache
  ansible.builtin.file:
    path: /etc/sudoers.d/00-timestamp
    state: absent
  become: true
  when: not (sudoers_shared_timestamp | bool)

# ---------------------------------------------------------------------------
# Touch ID
# ---------------------------------------------------------------------------
# /etc/pam.d/sudo already ends its first line with `auth include sudo_local`;
# the file it includes is simply absent on a stock system. Writing it is the
# supported way to change how sudo authenticates, and survives system updates.

- name: Sudoers | look for the pam_reattach module
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/lib/pam/pam_reattach.so"
  register: sudoers_reattach_module
  changed_when: false
  check_mode: false
  when:
    - sudoers_touchid_enabled | bool
    - sudoers_touchid_pam_reattach | bool

# A PAM line pointing at a module that is not there is `optional`, so it would
# not break sudo - it would just quietly never work. Say so instead.
- name: Sudoers | fail when pam_reattach is requested but not installed
  ansible.builtin.assert:
    that: sudoers_reattach_module.stat.exists | default(false)
    fail_msg: >-
      sudoers_touchid_pam_reattach is on, but
      {{ homebrew_prefix }}/lib/pam/pam_reattach.so does not exist.
      Run `brew install pam-reattach`, or turn the flag off - it is only
      needed for Touch ID inside tmux/screen.
  when:
    - sudoers_touchid_enabled | bool
    - sudoers_touchid_pam_reattach | bool

- name: Sudoers | enable Touch ID for sudo
  ansible.builtin.template:
    src: sudo_local.j2
    dest: /etc/pam.d/sudo_local
    owner: root
    group: wheel
    mode: "0444"
  become: true
  when: sudoers_touchid_enabled | bool

- name: Sudoers | remove the Touch ID PAM include when disabled
  ansible.builtin.file:
    path: /etc/pam.d/sudo_local
    state: absent
  become: true
  when: not (sudoers_touchid_enabled | bool)
