---
# tunneling - opens the configured set of SSH and GCP/IAP tunnels at login.
#
# This role only owns the parts brew does not: the LaunchAgent and its log
# rotation. There is no plist for it in this repo - tunneling renders and
# loads its own from internal/service, exactly like kerberoskeepalive,
# macswitcher and omt. See CONVENTIONS.md.
#
# No cask exists for it yet, so on a machine that has not built it from source
# the stat below fails and the whole role warns and skips. Once
# schretzi/tap/tunneling is published, add it to Brewfiles/00_base.brew and
# this role needs no change - only tunneling_bin_dir does, from ~/bin to
# {{ homebrew_prefix }}/bin.

- name: Tunneling | check the binary is installed
  ansible.builtin.stat:
    path: "{{ tunneling_bin }}"
  register: tunneling_binary
  changed_when: false
  check_mode: false

- name: Tunneling | warn when the binary is missing
  ansible.builtin.debug:
    msg: >-
      tunneling is not installed at {{ tunneling_bin }} - build and install it
      from its repo (`make install`), or install the cask once it exists.
      Skipping the LaunchAgent.
  when: not tunneling_binary.stat.exists

# Fails fast if the installed build predates the `service` convention, rather
# than quietly installing a plist with the wrong label.
- name: Tunneling | require a build that implements the current convention
  ansible.builtin.include_role:
    name: launchd
    tasks_from: require_service_cli
  vars:
    service_cli_bin: "{{ tunneling_bin }}"
    service_cli_label: com.schretzi.tunneling
  when: tunneling_binary.stat.exists

# `service install` refuses to install when the config does not parse, so a
# missing or broken ~/.config/tunneling/config.yaml surfaces here rather than
# as a background crash-loop nobody notices.
#
# It is also how a *changed* config is applied: every tunnel holds a bound
# listener for the life of the process, so tunneling re-reads nothing at
# runtime. install unloads and reloads, which is the restart.
- name: Tunneling | install the LaunchAgent
  ansible.builtin.command:
    cmd: "{{ tunneling_bin }} service install"
  register: tunneling_service
  changed_when: "'installed and started' in tunneling_service.stdout"
  failed_when: false
  when: tunneling_binary.stat.exists

- name: Tunneling | warn when the LaunchAgent could not be installed
  ansible.builtin.debug:
    msg: >-
      tunneling service install failed:
      {{ tunneling_service.stderr | default(tunneling_service.stdout) | trim }}
      (usually a missing ~/.config/tunneling/config.yaml - see
      `tunneling config init`)
  when: tunneling_binary.stat.exists and tunneling_service.rc != 0

- name: Tunneling | rotate its logs
  ansible.builtin.include_role:
    name: newsyslog
  vars:
    newsyslog_conf: tunneling.conf
  when: tunneling_binary.stat.exists

- name: Tunneling | forget variables
  ansible.builtin.set_fact:
    tunneling_binary: null
    tunneling_service: null
