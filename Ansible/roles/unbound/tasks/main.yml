---
# Old_Setup.md -> "DNS"
#
# A local unbound resolver so home LAN, k3d clusters, lima and (optionally)
# an employer intranet all resolve at the same time, without editing
# /etc/resolv.conf every time the network changes.
#
# Chain: loopback aliases -> _unbound system account -> configs -> DNSSEC
# anchor + control certs -> LaunchDaemon.

- name: Unbound | check the binary is installed
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/sbin/unbound"
  register: unbound_bin

- name: Unbound | fail when unbound is missing
  ansible.builtin.fail:
    msg: "{{ homebrew_prefix }}/sbin/unbound not found - install 00_base.brew first."
  when: not unbound_bin.stat.exists

# --------------------------------------------------------------------------
# 1. Loopback aliases
# --------------------------------------------------------------------------
- name: Unbound | install the loopback alias script
  ansible.builtin.copy:
    src: "{{ repo_root }}/Scripts/MacOS/localhost_alias.sh"
    dest: /usr/local/bin/localhost_alias
    owner: root
    group: wheel
    mode: "0755"
  become: true

- name: Unbound | install the loopback alias daemon
  ansible.builtin.include_role:
    name: launchd
    tasks_from: daemon
  vars:
    launchd_plist: org.localhost.alias.plist
    launchd_label: org.localhost.alias

- name: Unbound | apply the aliases now (they are lost on reboot otherwise)
  ansible.builtin.command:
    cmd: "/usr/local/bin/localhost_alias {{ unbound_loopback_aliases | join(' ') }}"
  become: true
  register: unbound_alias_run
  changed_when: false
  check_mode: false

- name: Unbound | read the addresses on lo0
  ansible.builtin.command:
    cmd: ifconfig lo0
  register: unbound_alias_check
  changed_when: false
  check_mode: false

- name: Unbound | verify 127.0.0.2 exists on lo0
  ansible.builtin.assert:
    that: "'127.0.0.2' in unbound_alias_check.stdout"
    fail_msg: >-
      127.0.0.2 is not on lo0, so unbound has nothing to bind to. Check
      /tmp/localhost_alias.err.log and that /usr/local/bin/localhost_alias is
      executable.

# --------------------------------------------------------------------------
# 2. System account
# --------------------------------------------------------------------------
- name: Unbound | does the service account already exist?
  ansible.builtin.command:
    cmd: "dscl . -read /Users/{{ unbound_user }}"
  become: true
  register: unbound_user_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Unbound | create the service account
  when: unbound_user_check.rc != 0
  become: true
  block:
    - name: Unbound | create group
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - "dscl . -create /Groups/{{ unbound_user }}"
        - "dscl . -create /Groups/{{ unbound_user }} PrimaryGroupID {{ unbound_gid }}"
      changed_when: true

    - name: Unbound | create user
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        # RecordName lists both names so a config saying either "_unbound" or
        # the compiled-in default "unbound" resolves to this account.
        - "dscl . -create /Users/{{ unbound_user }}"
        - "dscl . -create /Users/{{ unbound_user }} RecordName {{ unbound_user }} unbound"
        - "dscl . -create /Users/{{ unbound_user }} RealName 'Unbound DNS server'"
        - "dscl . -create /Users/{{ unbound_user }} UniqueID {{ unbound_uid }}"
        - "dscl . -create /Users/{{ unbound_user }} PrimaryGroupID {{ unbound_gid }}"
        - "dscl . -create /Users/{{ unbound_user }} UserShell /usr/bin/false"
        - "dscl . -create /Users/{{ unbound_user }} Password '*'"
        - "dscl . -create /Groups/{{ unbound_user }} GroupMembership {{ unbound_user }}"
      changed_when: true

# --------------------------------------------------------------------------
# 3. Configuration - repo is the truth, brew's etc dir gets symlinks
# --------------------------------------------------------------------------
# unbound_etc needs group-write for {{ unbound_user }}: unbound periodically
# rewrites its auto-trust-anchor-file (root.key) in place there (a
# write-new-file-then-rename), and without it the write fails with
# "Permission denied", which unbound treats as fatal — causing a crash loop
# (new PID every few seconds) that is easy to mistake for a DNS-availability
# bug rather than a filesystem-permission one.
- name: Unbound | ensure unbound's own etc directory is group-writable
  ansible.builtin.file:
    path: "{{ unbound_etc }}"
    state: directory
    group: "{{ unbound_user }}"
    mode: "0775"

- name: Unbound | ensure the conf.d directory exists
  ansible.builtin.file:
    path: "{{ unbound_confd }}"
    state: directory
    mode: "0755"

# unbound.conf puts the remote-control socket here.
- name: Unbound | ensure the control socket directory exists
  ansible.builtin.file:
    path: "{{ unbound_run_dir }}"
    state: directory
    mode: "0755"

# brew ships a pristine 58k default unbound.conf. Keep a copy the first time so
# the vendor defaults are still available for reference.
- name: Unbound | is brew's default config still a real file?
  ansible.builtin.stat:
    path: "{{ unbound_etc }}/unbound.conf"
    follow: false
  register: unbound_existing

- name: Unbound | preserve brew's untouched default
  ansible.builtin.copy:
    src: "{{ unbound_etc }}/unbound.conf"
    dest: "{{ unbound_etc }}/unbound.conf.brew-default"
    remote_src: true
    force: false
    mode: "0644"
  when:
    - unbound_existing.stat.exists
    - not unbound_existing.stat.islnk

- name: Unbound | link the main config into {{ unbound_etc }}
  ansible.builtin.file:
    src: "{{ repo_root }}/Dotfiles/unbound/unbound.conf"
    dest: "{{ unbound_etc }}/unbound.conf"
    state: link
    force: true
  register: unbound_main_conf

# Overlay repositories contribute their own zone profiles - intranet forward
# zones in particular - each carrying `root:` pointing at its checkout.
- name: Unbound | merge overlay zone profiles
  ansible.builtin.set_fact:
    unbound_all_profiles: "{{ unbound_profiles + unbound_profiles_overlay }}"

# forwarders.conf starts as a symlink to the repo's safe default. Once
# macswitcher switches contexts it replaces that link with a real file so the
# runtime can update forwarders without modifying the repository. Ansible must
# preserve that real file on later runs.
- name: Unbound | inspect the managed forwarders file
  ansible.builtin.stat:
    path: "{{ unbound_confd }}/forwarders.conf"
    follow: false
  register: unbound_forwarders_state

- name: Unbound | install the default forwarders link on first setup
  ansible.builtin.file:
    src: "{{ repo_root }}/Dotfiles/unbound/forwarders.conf"
    dest: "{{ unbound_confd }}/forwarders.conf"
    state: link
    force: true
  when: not unbound_forwarders_state.stat.exists

- name: Unbound | activate the selected zone profiles
  ansible.builtin.file:
    src: "{{ item.root | default(repo_root) }}/Dotfiles/unbound/{{ item.file }}"
    dest: "{{ unbound_confd }}/{{ item.file }}"
    state: link
    force: true
  loop: "{{ unbound_all_profiles
            | rejectattr('file', 'equalto', 'forwarders.conf')
            | selectattr('enabled') | list }}"
  loop_control:
    label: "{{ item.file }}"
  register: unbound_profiles_linked

- name: Unbound | deactivate the profiles that are switched off
  ansible.builtin.file:
    path: "{{ unbound_confd }}/{{ item.file }}"
    state: absent
  loop: "{{ unbound_all_profiles
            | rejectattr('file', 'equalto', 'forwarders.conf')
            | rejectattr('enabled') | list }}"
  loop_control:
    label: "{{ item.file }}"
  register: unbound_profiles_removed

# Seed files (kiac.conf) are copied - never linked - and only when conf.d has
# none yet: `force: false` makes copy a no-op if the destination already
# exists, so a real file dropped/edited there (by hand or by the kubernetes
# ansible) is never touched again, unlike the symlinked profiles above.
#
# One-time migration: kiac.conf used to be in unbound_profiles and got
# symlinked like any other profile. A symlink still counts as "exists" to the
# copy task below, so it would never get materialized into a real file on its
# own - remove it first, but only the still-symlinked case, never a real file.
- name: Unbound | check seed files for a leftover symlink from the old setup
  ansible.builtin.stat:
    path: "{{ unbound_confd }}/{{ item }}"
    follow: false
  loop: "{{ unbound_confd_seed_files }}"
  loop_control:
    label: "{{ item }}"
  register: unbound_seed_files_state

- name: Unbound | replace a leftover seed file symlink with a real copy
  ansible.builtin.file:
    path: "{{ unbound_confd }}/{{ item.item }}"
    state: absent
  loop: "{{ unbound_seed_files_state.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists and item.stat.islnk

- name: Unbound | seed conf.d files that are managed elsewhere after first install
  ansible.builtin.copy:
    src: "{{ repo_root }}/Dotfiles/unbound/{{ item }}"
    dest: "{{ unbound_confd }}/{{ item }}"
    force: false
    mode: "0644"
  loop: "{{ unbound_confd_seed_files }}"
  register: unbound_seed_files_copied

# A profile file that was deleted from the repo leaves a dangling symlink here,
# and unbound refuses to start on an include it cannot open - a failure that
# only shows up at the next reload or reboot. Remove broken links outright.
- name: Unbound | find broken links in conf.d
  ansible.builtin.shell:
    cmd: 'find "{{ unbound_confd }}" -type l ! -exec test -e {} \; -print'
  register: unbound_broken_links
  changed_when: false
  check_mode: false

- name: Unbound | remove links whose target is gone
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ unbound_broken_links.stdout_lines | default([]) }}"
  register: unbound_links_pruned

# Anything dropped into conf.d by hand is loaded too, and would silently
# survive a profile being disabled. Point it out rather than deleting it.
- name: Unbound | look for unmanaged files in conf.d
  ansible.builtin.find:
    paths: "{{ unbound_confd }}"
    patterns: "*.conf"
    file_type: any
  register: unbound_confd_found

- name: Unbound | warn about unmanaged conf.d entries
  ansible.builtin.debug:
    msg: >-
      {{ item }} is in conf.d but not listed in unbound_profiles or
      unbound_confd_seed_files - unbound is loading it. Add it to
      Ansible/roles/unbound/defaults/main.yml or remove it.
  loop: >-
    {{ unbound_confd_found.files | map(attribute='path') | map('basename') | list
       | difference(unbound_all_profiles | map(attribute='file') | list)
       | difference(unbound_confd_seed_files) }}

# --------------------------------------------------------------------------
# 4. DNSSEC anchor + remote-control certificates
# --------------------------------------------------------------------------
- name: Unbound | fetch the DNSSEC root trust anchor
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/sbin/unbound-anchor -a {{ unbound_etc }}/root.key"
    creates: "{{ unbound_etc }}/root.key"
  become: true
  # unbound-anchor exits 1 when it had to bootstrap the anchor from the built-in
  # certificate; that is the normal first-run path, not a failure.
  failed_when: false

- name: Unbound | generate unbound-control certificates
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/sbin/unbound-control-setup -d {{ unbound_etc }}"
    creates: "{{ unbound_etc }}/unbound_server.key"
  become: true

- name: Unbound | let the service account read its own key
  ansible.builtin.file:
    path: "{{ unbound_etc }}/unbound_server.key"
    owner: "{{ unbound_user }}"
    group: "{{ unbound_gid }}"
    mode: "0640"
  become: true
  failed_when: false

# The root trust anchor is public IANA data, not a secret. It has to stay
# *writable* by the account unbound drops privileges to - RFC 5011 rewrites it
# in place as the root KSK rolls - but it also has to be *readable* by you, or
# `unbound-checkconf` fails with the deeply unhelpful
# "validator: could not apply configuration settings".
- name: Unbound | make the trust anchor writable by unbound and readable by all
  ansible.builtin.file:
    path: "{{ unbound_etc }}/root.key"
    owner: "{{ unbound_user }}"
    group: admin
    mode: "0644"
  become: true
  failed_when: false

# `unbound-control` runs as you, not as root, so it needs to read the control
# key. The matching certificate stays world-readable because the daemon (running
# as {{ unbound_user }}) has to read it too in order to verify clients.
- name: Unbound | hand the control key to the logged-in user
  ansible.builtin.file:
    path: "{{ unbound_etc }}/unbound_control.key"
    owner: "{{ ansible_facts.user_id }}"
    group: staff
    mode: "0600"
  become: true
  failed_when: false

- name: Unbound | make the control certificate readable by both sides
  ansible.builtin.file:
    path: "{{ unbound_etc }}/{{ item }}"
    owner: root
    mode: "0644"
  become: true
  loop:
    - unbound_control.pem
    - unbound_server.pem
  failed_when: false

# --------------------------------------------------------------------------
# 5. Validate, then start
# --------------------------------------------------------------------------
- name: Unbound | check the configuration for errors
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/sbin/unbound-checkconf {{ unbound_etc }}/unbound.conf"
  register: unbound_checkconf
  changed_when: false
  check_mode: false
  failed_when: unbound_checkconf.rc != 0

- name: Unbound | show checkconf result
  ansible.builtin.debug:
    var: unbound_checkconf.stdout_lines

# Deploying a config does nothing on its own - unbound keeps serving whatever
# it parsed at startup. Without this, editing a zone file appears to work and
# silently changes nothing until the next reboot.
#
# Which action is needed depends on what changed: `reload` re-reads the config
# but cannot rebind sockets, so an edit to unbound.conf itself (interfaces,
# ports, remote-control) needs a full restart. Zone files under conf.d only
# need a reload, which is cheaper - it keeps the cache.
- name: Unbound | decide whether a reload or a restart is needed
  ansible.builtin.set_fact:
    unbound_needs_restart: "{{ unbound_main_conf.changed | default(false) }}"
    unbound_needs_reload: >-
      {{ (unbound_profiles_linked.changed | default(false))
         or (unbound_profiles_removed.changed | default(false))
         or (unbound_seed_files_copied.changed | default(false))
         or (unbound_links_pruned.changed | default(false)) }}

- name: Unbound | install the resolver daemon
  ansible.builtin.include_role:
    name: launchd
    tasks_from: daemon
  vars:
    launchd_plist: net.unbound.plist
    launchd_label: net.unbound

# Passwordless restarts (flush_dns alias, unbound-restart, DNS cache flush)
# are managed centrally by the sudoers role - see roles/sudoers/defaults/main.yml.

- name: Unbound | restart after a change to the main configuration
  ansible.builtin.command:
    cmd: launchctl kickstart -k system/net.unbound
  become: true
  when: unbound_needs_restart | bool
  changed_when: true

- name: Unbound | reload after a zone profile change
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/sbin/unbound-control reload"
  when:
    - unbound_needs_reload | bool
    - not (unbound_needs_restart | bool)
  register: unbound_reloaded
  changed_when: true
  # A reload can only work once the daemon is running the config that grants
  # this user control access; on the very first run it is not yet, and the
  # restart above covers it.
  failed_when: false

- name: Unbound | give the daemon a moment to bind
  ansible.builtin.wait_for:
    host: 127.0.0.2
    port: 53
    timeout: 15
  register: unbound_listening
  failed_when: false

- name: Unbound | resolve a name through the new resolver
  ansible.builtin.command:
    cmd: "dig +short +time=3 +tries=1 @127.0.0.2 example.com A"
  register: unbound_dig
  changed_when: false
  check_mode: false
  failed_when: false

# A SERVFAIL on a broken domain proves *something* validated - possibly the
# upstream resolver. The AD flag on a good domain is what proves it was us.
- name: Unbound | check DNSSEC validation is actually local
  ansible.builtin.command:
    cmd: "dig +dnssec +time=3 +tries=1 @127.0.0.2 cloudflare.com A"
  register: unbound_dnssec
  changed_when: false
  check_mode: false
  failed_when: false

- name: Unbound | report DNSSEC state
  ansible.builtin.debug:
    msg: >-
      {{ 'DNSSEC: validating locally (AD flag set)'
         if ('flags:' in (unbound_dnssec.stdout | default('')) and ' ad' in (unbound_dnssec.stdout | regex_search('flags:[^;]*') | default('')))
         else 'DNSSEC: NOT validating locally - answers carry no AD flag. Check auto-trust-anchor-file and that root.key is readable by unbound.' }}

- name: Unbound | report success
  ansible.builtin.debug:
    msg: >-
      unbound is answering on 127.0.0.2:53
      (example.com -> {{ unbound_dig.stdout_lines | first | default('?') }})
  when: unbound_dig.stdout | length > 0

# When unbound will not start, the reason is always in its error log and never
# in the Ansible output - which is what made a missing vmnet interface take so
# long to diagnose. Surface the log here instead of pointing at it.
- name: Unbound | read the error log after a failed start
  ansible.builtin.command:
    cmd: tail -n 15 /tmp/unbound.err.log
  register: unbound_errlog
  changed_when: false
  check_mode: false
  failed_when: false
  when: unbound_dig.stdout | length == 0

- name: Unbound | fail with the reason it did not start
  ansible.builtin.fail:
    msg: |-
      unbound is not answering on 127.0.0.2:53.

      Last lines of /tmp/unbound.err.log:
      {{ unbound_errlog.stdout | default('(log empty - the daemon may not have been started at all)') }}

      Common causes:
        * "Can't assign requested address" - a named interface does not exist.
          unbound refuses to start if ANY configured interface is missing, and
          macOS cannot bind an address that is not up yet. The base config binds
          0.0.0.0 for this reason; check for an interface: line added elsewhere.
        * "Address already in use" - something else holds port 53.
          Find it with: sudo lsof -nP -iUDP:53 -iTCP:53
        * "Permission denied" - started as a normal user. Port 53 is privileged;
          the daemon must come from launchd:
          sudo launchctl kickstart -k system/net.unbound

      The daemon has KeepAlive set, so it retries every ~10s: fix the config and
      it comes back on its own, no sudo needed.
  when: unbound_dig.stdout | length == 0

- name: Unbound | remind about the system resolver
  ansible.builtin.debug:
    msg: >-
      unbound binds all IPv4 addresses but only answers the ranges listed in
      access-control (loopback and the vmnet). To route the whole machine
      through it, set 127.0.0.2 as the DNS server of the active network
      service - see Setup.md -> DNS.
