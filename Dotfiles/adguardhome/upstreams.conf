# Default upstreams for AdGuard Home (dns.upstream_dns_file).
#
# Seeded from this file once; from then on macswitcher owns it and rewrites
# the default block on every network context switch. It preserves any
# "[/domain/]address" line it finds, so the per-domain upstreams the overlays
# contribute survive a switch - dropping them would silently take an intranet
# off the air, which is the kind of failure that only shows up an hour later.
#
# AdGuard Home only treats a line as a comment when it starts with '#'. A
# trailing "9.9.9.9 # note" parses the '#' as a second upstream address and is
# rejected, so every comment gets its own line.

# Quad9, then Google.
9.9.9.9
8.8.8.8
