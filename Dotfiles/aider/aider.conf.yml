# aider, pointed at the local ollama server.
#
# Linked to ~/.aider.conf.yml by Ansible/roles/ai (ai_optional_links). aider
# reads that path for every run, plus a .aider.conf.yml in the repo it is
# working on, so per-project overrides stay possible without touching this.
#
# The model has to be created before this is any use:
#
#   Scripts/ollama-import-model.sh --pull --name devstral:32k Devstral-Small-2
#
# ollama is a RunAtLoad=false LaunchAgent (plists/LaunchAgents/
# com.schretzi.ollama.plist), so it is not listening until something starts
# it. `ollama_service start` is that something. aider gives a connection
# error rather than starting it.

# The ollama_chat/ prefix, not ollama/. Both reach the same server, but
# ollama_chat/ routes through /api/chat and applies the model's own chat
# template; ollama/ uses the older completion endpoint and leaves the prompt
# formatting to litellm, which for an instruct model means worse output for
# no benefit.
model: ollama_chat/devstral:32k

# Commit messages and history summarisation. Left on the same model on
# purpose: the alternative default is a cloud model, and a local-only setup
# that silently reaches for an API key when it summarises is the failure
# worth avoiding here.
weak-model: ollama_chat/devstral:32k

# launchd does not source the shell, and neither does aider - this is what
# tells litellm where the server is. Loopback by IP rather than "localhost":
# on a dual-stack machine localhost can resolve to ::1 first, and ollama
# binds 127.0.0.1 only.
# NO_PROXY already covers 127.0.0.1, so the model call never touches privoxy -
# verified, privoxy logged nothing for port 11434.
set-env:
  - OLLAMA_API_BASE=http://127.0.0.1:11434
  # litellm otherwise fetches its price/context table from raw.githubusercontent
  # on every start. That fails here - privoxy inspects HTTPS and signs with the
  # local CA, which aider's bundled certifi does not trust - and it is useless
  # anyway for a local model whose settings come from .aider.model.settings.yml.
  # This makes litellm use its built-in copy instead of asking.
  - LITELLM_LOCAL_MODEL_COST_MAP=True

# The pypi version check fails for the same certifi reason and prints an SSL
# traceback on every run. Upgrades come from uv here, not from aider noticing.
check-update: false

# 32k is enough to work in but not enough to be careless with. The repo map
# is the part that grows without asking, so it gets an explicit budget rather
# than aider's default sizing against a much larger window.
map-tokens: 1024

# Local models are slower than cloud ones and a wrong guess costs a whole
# generation, so aider asks before pulling extra files into the chat.
yes-always: false
