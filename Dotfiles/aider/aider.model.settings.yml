# Per-model settings for aider. Linked to ~/.aider.model.settings.yml.
#
# This file is the client-side half of the 32k context window, and without it
# the model-side half does not survive contact with aider.
#
# The `PARAMETER num_ctx 32768` baked into the ollama model by
# Scripts/ollama-import-model.sh is only a default. litellm sends its own
# options block on every request, and whatever it puts in there wins. So the
# number has to appear in both places, and they have to agree - if this file
# says more than the model was built with, ollama silently allocates the
# larger KV cache anyway; if it says less, the extra context is simply unused.
#
# Names must match the --model string exactly, ollama_chat/ prefix included.

- name: ollama_chat/devstral:32k
  # Devstral is trained for code editing and handles unified diffs reliably,
  # which is the format that does not resend a whole file per edit - the
  # difference between a change costing a few hundred tokens and a few
  # thousand, and at 32k that is the difference that matters.
  edit_format: diff
  use_repo_map: true
  # Devstral emits no reasoning block, so nothing needs stripping.
  extra_params:
    num_ctx: 32768
