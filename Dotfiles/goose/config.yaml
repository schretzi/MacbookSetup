# goose, pointed at the local ollama server.
#
# Linked to ~/.config/goose/config.yaml by Ansible/roles/ai (ai_optional_links).
# `goose configure` rewrites this file in place, so treat an interactive
# reconfigure as an edit of the repo copy - it follows the symlink. It also
# rewrites it WITHOUT these comments and re-serialises the whole thing,
# including the `extensions:` block below, so after a reconfigure check
# `git diff` here and put the reasoning back rather than committing the dump.
#
# The model has to exist before this is any use:
#
#   Scripts/ollama-import-model.sh --pull --name devstral:32k Devstral-Small-2
#
# ollama is a RunAtLoad=false LaunchAgent, so `ollama_service start` first.

# By IP rather than "localhost": on a dual-stack machine localhost can resolve
# to ::1 first and ollama binds 127.0.0.1 only. NO_PROXY already covers it, so
# this never goes through privoxy.
OLLAMA_HOST: http://127.0.0.1:11434

# Both halves of the context window, and both are needed for different reasons.
#
# GOOSE_CONTEXT_LIMIT is goose's own budgeting number - what it believes the
# window is, and therefore when it compacts a session. Left unset it defaults
# to 128000 for an unrecognised model, which this is: measured, a fresh session
# reported "13k/128k" while ollama had the model loaded at 32768. goose would
# have kept filling a window four times larger than the server's, and llama.cpp
# truncates an over-long prompt rather than refusing it - so the failure would
# have been silently dropped context, not an error.
GOOSE_CONTEXT_LIMIT: 32768

# GOOSE_INPUT_LIMIT is the other half: goose maps it onto ollama's num_ctx.
# This is what separates goose from opencode - goose uses ollama's native API
# and can send num_ctx, where opencode's OpenAI-compatible transport has no
# such field and can only inherit the tag. Set to the same number so the two
# agree; a mismatch here is what the tag naming exists to prevent.
GOOSE_INPUT_LIMIT: 32768

# goose defaults to "auto", which executes tool calls without asking. That is a
# reasonable default for a frontier model and a poor one for a 24B running
# locally with shell access - `goose doctor` on this setup already produced a
# confidently invented `go install github.com/AAIF/goose@latest`. smart_approve
# lets read-only calls through and asks before anything with consequences.
GOOSE_MODE: smart_approve

# goose's own serialisation of the bundled extension toggles - written by
# `goose configure`, not hand-authored. Kept in git because which of these are
# enabled is a real setting, but expect goose to reorder and reformat the whole
# block on the next reconfigure.
extensions:
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  scheduler:
    enabled: true
    type: platform
    name: scheduler
    description: Create and manage scheduled recipe execution
    display_name: Scheduler
    bundled: true
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true

# Where GOOSE_PROVIDER/GOOSE_MODEL used to live - newer goose serialises the
# provider as a block plus `active_provider` instead of the two flat keys.
# goose has a first-class ollama provider (no OpenAI-compatibility shim and no
# API key), which is why it needs nothing from ~/.zsh/rcs/ca the way opencode
# does.
providers:
  ollama:
    enabled: true
    model: devstral:32k
    configured: true
active_provider: ollama

# Added by goose itself on reconfigure, defaulting to on. Left as goose set it;
# flip to false if this should not phone home.
GOOSE_TELEMETRY_ENABLED: true

