# Per-session macOS app wrappers - the single source of truth shared by
# scripts/make-session-apps.sh (which builds the bundles) and
# scripts/kitty-focus-or-launch.sh (which launches/focuses through them).
#
# Why these exist: Cmd-Tab is an APPLICATION switcher, and the name it shows
# comes from the app bundle, not the window title. Every dedicated instance
# used to execute /Applications/kitty.app, so macOS listed five identical
# "kitty" entries with no way to tell them apart. Giving each session its own
# tiny wrapper bundle (own CFBundleName + icon, everything else symlinked back
# to the real kitty.app) makes Cmd-Tab show "Mail", "Obsidian", etc.
#
# Format, one session per line, fields separated by "|":
#   <session-glob>|<App Name>|<icon letter>|<icon R G B, 0.0-1.0 sRGB>
#
# <session-glob> is matched against the session file's basename with the
# .kitty-session suffix removed, as a shell glob (see the `case` in
# kitty-focus-or-launch.sh) - that's what lets the daily-note entry cover
# daily-note-YYYY-MM-DD, whose filename changes every day.
#
# Sessions with no entry here (notably `home`) are launched through plain
# kitty.app exactly as before. home is deliberately excluded: it's the Dock
# icon / startup_session instance, so it should stay "kitty".
#
# A private overlay repo adds its own sessions in
# ~/.config/kitty/session-apps.d/*.conf (same format, read first), mirroring
# the `globinclude local.d/*.conf` that kitty.conf itself uses. Overlay-only
# sessions must NOT be listed here, or a machine without that overlay builds a
# wrapper for a session it does not have.
#
# After editing this file, re-run scripts/make-session-apps.sh.

setup|Setup|S|0.90 0.55 0.15
obsidian|Obsidian|O|0.49 0.34 0.76
mail|Neomutt|N|0.20 0.45 0.85
daily-note-*|Daily Note|D|0.20 0.65 0.40
