local_proxy:
  host: 127.0.0.1
  port: 3128
  no_proxy:
    - localhost
    - 127.0.0.1
    - ::1
    - kubernetes
    - kiac
alpaca:
  enabled: true
  command:
    - alpaca
    - -l
    - "{{local_host}}"
    - -p
    - "{{local_port}}"
    - -C
    - "{{pac_file}}"
network_services: []
dns:
  local_resolver: 127.0.0.2
unbound:
  forwarders_file: /opt/homebrew/etc/unbound/conf.d/forwarders.conf
adguard:
  upstreams_file: /opt/adguardhome/upstreams.conf
daemons:
  unbound:
    label: net.unbound
    scope: system
  adguardhome:
    label: com.schretzi.adguardhome
    scope: system
  kerberos_keep_alive:
    label: com.schretzi.kerberoskeepalive
  omt:
    label: com.schretzi.omt
  vpn:
    label: com.schretzi.corp-vpn
    interface: utun99
  tunneling:
    label: com.schretzi.tunneling
applications:
  docker:
    start:
      - open
      - -a
      - Docker
    stop:
      - osascript
      - -e
      - tell application "Docker" to quit
    restart:
      - sh
      - -c
      - osascript -e 'tell application "Docker" to quit' && open -a Docker
  streamdeck:
    start:
      - open
      - -a
      - Elgato Stream Deck
    stop:
      - osascript
      - -e
      - tell application "Elgato Stream Deck" to quit
  unbound:
    restart:
      - sudo
      - launchctl
      - kickstart
      - -k
      - system/net.unbound
    reload:
      - unbound-control
      - reload
  adguardhome:
    restart:
      - sudo
      - launchctl
      - kickstart
      - -k
      - system/com.schretzi.adguardhome
