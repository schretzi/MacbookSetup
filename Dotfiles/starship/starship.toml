"$schema" = 'https://starship.rs/config-schema.json'

# Starship otherwise runs on its built-in defaults (directory, git_branch,
# git_status, gcloud, character, ...) - see Setup.md -> "Starship prompt".
# `$all` keeps every one of those in its default order/style; only the
# modules referenced explicitly below (line_break, env_var.PROXY_STATE,
# kubernetes, character) are pulled out of that default position and placed
# on their own line instead.
format = """$all$line_break${env_var.PROXY_STATE}$line_break$kubernetes$line_break$character"""

# Reflects PROXY_STATE from Dotfiles/macswitcher/proxy.zsh, which macswitcher
# rewrites on every context switch: off | on | filtered. Shown always, not
# just when a proxy is active, so an accidentally-left-on proxy is never
# invisible - and "filtered" is there because "on" cannot say whether what is
# on also filters URLs (Setup.md -> "Filtering proxy").
#
# One module, one style, because Starship cannot colour an env_var by its
# value. The word carries the distinction instead.
[env_var.PROXY_STATE]
variable = "PROXY_STATE"
format = "proxy: [$env_value]($style) "
style = "bold yellow"
default = "off"

# Disabled by default in starship; enabled here since every cluster context
# comes from the kubeconfig role (Setup.md -> Kubernetes) and knowing which
# one is active before running kubectl matters.
[kubernetes]
disabled = false
format = '[⛵ $context( ($namespace))]($style) '
style = "bold blue"
