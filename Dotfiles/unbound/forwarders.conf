# Default forwarders for unbound (conf.d/forwarders.conf).
#
# Seeded from this file once; from then on macswitcher owns it and rewrites
# this forward-zone block on every network context switch - see
# macswitcher's README -> DNS.
forward-zone:
  name: "."
  forward-addr: 9.9.9.9
  forward-addr: 1.1.1.1
