# ============================================================================
# Upstream forwarders - where unbound sends anything it cannot answer locally.
# ============================================================================
# Split out of unbound.conf on purpose: this is the file you edit when the
# network changes (office LAN, hotel wifi, a VPN that insists on its own
# resolvers). Everything else in the unbound setup can stay untouched.
#
# After editing:      unbound-control reload      (no sudo needed)
# To check first:     unbound-checkconf /opt/homebrew/etc/unbound/unbound.conf
#
# Order matters only within a zone: unbound tries the listed addresses and
# sticks with whichever answers fastest, so putting a slow resolver first
# costs nothing after the first few queries.
#
# NOTE: a forward-zone for "." here is the *default* route for everything.
# An overlay adding its own "." forward-zone (a corporate PAC-style proxy
# resolver, say) would conflict with this one - which is why the work overlay
# ships that as a profile you switch on deliberately rather than by default.
# ============================================================================

# --- container runtime DNS --------------------------------------------------
# Nothing here on purpose.
#
# There used to be a `docker.arpa` forward to 127.0.0.1@15353. That was
# Colima's resolver; Colima is no longer installed and nothing listens on that
# port, so every docker.arpa query was being forwarded into a closed port.
#
# Apple's `container` runtime does not need an entry here either - it registers
# a macOS split-DNS domain instead:
#
#   sudo container system dns create mydomain
#   container system dns list
#
# That writes /etc/resolver/mydomain, which mDNSResponder consults *before* the
# configured nameserver, so those names resolve on the host whether or not the
# system points at unbound.
#
# The one case that would need a forward-zone here: making container names
# resolvable from the kiac VMs. They query unbound directly at the vmnet
# gateway and never see the host's /etc/resolver. If you add one, add
# `domain-insecure` for it too when it sits under a signed parent - .arpa is
# signed, which is exactly why the old docker.arpa entry would have failed
# DNSSEC validation had it still been live. See Setup.md -> DNSSEC.

# --- default upstream -------------------------------------------------------
# Quad9 first (filters known-malicious domains, no logging), Google as fallback.
# Swap these for the LAN gateway when a network hands out resolvers that know
# names the public internet does not, e.g.:
#   forward-addr: 192.168.1.1
forward-zone:
  name: "."
  forward-addr: 9.9.9.9
  forward-addr: 8.8.8.8
