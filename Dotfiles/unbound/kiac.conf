server:
  # .kiac is a private, undelegated TLD that we own entirely, so `static`:
  # names we define are answered, everything else under .kiac gets a local
  # NXDOMAIN and never leaks upstream. (Your other zone files use
  # `transparent` because they overlay records on domains that really exist.)
  local-zone: "kiac." static

  # ---- global endpoints: exactly one instance each ----
  # host-side containers — each gets its own vmnet IP
  local-data: "gitea.kiac.          A 192.168.64.10"
  local-data: "registry.kiac.       A 192.168.64.11"
  local-data: "mirror-docker.kiac.  A 192.168.64.12"
  local-data: "mirror-quay.kiac.    A 192.168.64.13"
  local-data: "mirror-k8s.kiac.     A 192.168.64.14"
  local-data: "mirror-ghcr.kiac.    A 192.168.64.15"

  # served from main's Gateway — all share one LoadBalancer IP
  local-data: "openbao.kiac.        A 192.168.64.20"
  local-data: "argocd.kiac.         A 192.168.64.20"
  local-data: "grafana.kiac.        A 192.168.64.20"
  local-data: "alertmanager.kiac.   A 192.168.64.20"

  # ---- main ----
  local-data: "api.main.kiac.       A 192.168.64.20"
  local-data: "gw.main.kiac.        A 192.168.64.20"
  # `redirect` makes the zone apex answer for every name beneath it —
  # this is unbound's wildcard idiom, same as your kafka.k3d.localhost block
  local-zone: "apps.main.kiac." redirect
  local-data: "apps.main.kiac.      A 192.168.64.20"

  # ---- test1 ----
  local-data: "api.test1.kiac.      A 192.168.64.30"
  local-data: "gw.test1.kiac.       A 192.168.64.30"
  local-zone: "apps.test1.kiac." redirect
  local-data: "apps.test1.kiac.     A 192.168.64.30"
