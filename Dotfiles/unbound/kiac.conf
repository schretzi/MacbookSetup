server:
  # We own .kiac entirely, so `static`: defined names are answered, everything
  # else under .kiac gets a local NXDOMAIN and never leaks upstream.
  # Managed by Ansible (roles/host_dns) — do not hand-edit, re-run
  # playbooks/dns-update.yml instead.
  local-zone: "kiac." static

  # global endpoints — host-side containers, each with its own vmnet IP
  local-data: "gitea.kiac.  A 192.168.64.2"
  local-data: "registry.kiac.  A 192.168.64.14"
  local-data: "mirror-docker.kiac.  A 192.168.64.18"
  local-data: "mirror-quay.kiac.  A 192.168.64.17"
  local-data: "mirror-k8s.kiac.  A 192.168.64.15"
  local-data: "mirror-ghcr.kiac.  A 192.168.64.16"

  # main — Gateway address not known yet (skeleton pass, before the
  # cluster/Gateway/cert-manager exist); these records are added once
  # host_dns re-runs with host_dns_wait_for_gateway: true.

  # test1 — Gateway address not known yet (skeleton pass, before the
  # cluster/Gateway/cert-manager exist); these records are added once
  # host_dns re-runs with host_dns_wait_for_gateway: true.

