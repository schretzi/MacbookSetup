server:
  # We own .kiac entirely, so `static`: defined names are answered, everything
  # else under .kiac gets a local NXDOMAIN and never leaks upstream.
  # Managed by Ansible (roles/host_dns) — do not hand-edit, re-run
  # playbooks/dns-update.yml instead.
  local-zone: "kiac." static

  # global endpoints — host-side containers, each with its own vmnet IP
  local-data: "gitea.kiac.  A 192.168.64.24"
  local-data: "registry.kiac.  A 192.168.64.34"
  local-data: "mirror-docker.kiac.  A 192.168.64.35"
  local-data: "mirror-quay.kiac.  A 192.168.64.36"
  local-data: "mirror-k8s.kiac.  A 192.168.64.37"
  local-data: "mirror-ghcr.kiac.  A 192.168.64.38"

  # main
  local-data: "api.main.kiac.       A 192.168.64.27"
  local-data: "gw.main.kiac.        A 192.168.64.27"
  local-zone: "apps.main.kiac." redirect
  local-data: "apps.main.kiac.      A 192.168.64.27"
  local-data: "argocd.kiac.     A 192.168.64.27"
  local-data: "openbao.kiac.    A 192.168.64.27"
  local-data: "grafana.kiac.       A 192.168.64.27"
  local-data: "alertmanager.kiac.  A 192.168.64.27"

  # test1
  local-data: "api.test1.kiac.       A 192.168.64.26"
  local-data: "gw.test1.kiac.        A 192.168.64.26"
  local-zone: "apps.test1.kiac." redirect
  local-data: "apps.test1.kiac.      A 192.168.64.26"

