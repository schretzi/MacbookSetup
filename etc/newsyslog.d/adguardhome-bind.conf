# adguardhome-bind - LaunchDaemon com.schretzi.adguardhome-bind
#
# Safe with plain launchd capture: StartInterval/WatchPaths job that exits
# after each run, so it reopens both files on every launch.
#
# Unrelated to etc/newsyslog.d/adguardhome.conf - that one covers the
# resolver daemon's stderr, this one the bind-refresh job.
#
# logfilename                          owner:group  mode count size(KB) when flags
/Library/Logs/adguardhome-bind.log      root:wheel   644  5    5120     *    NJ
/Library/Logs/adguardhome-bind.err.log  root:wheel   644  5    5120     *    NJ
