# adguardhome - LaunchDaemon com.schretzi.adguardhome
#
# Only the err.log is listed here, and that is deliberate.
#
# adguardhome.log is written by AdGuard Home itself through its own rotating
# writer (log.max_size/max_backups/compress in AdGuardHome.yaml). It is a
# third-party binary that holds its fd open and has no way to notice a
# newsyslog rename, so rotating it here would leave the new file empty for
# ever - the failure that silently killed kanata's logging. Its own rotation
# owns that file; newsyslog must not touch it.
#
# adguardhome.err.log is launchd's capture of stderr: panics and anything
# before the logger is up. It stays a few KB, so the rename problem is
# theoretical for it - the same accepted exception as corp-vpn. See
# CONVENTIONS.md -> Rotation.
#
# logfilename                     owner:group  mode count size(KB) when flags
/Library/Logs/adguardhome.err.log   root:wheel   644  5    5120     *    NJ
