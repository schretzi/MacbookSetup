# container-autostart - LaunchAgent com.schretzi.container-autostart
#
# Safe with plain launchd capture: a RunAtLoad/StartInterval job that exits
# after each run, so it reopens both files on every launch and a rename
# between runs is invisible to it.
#
# A user's files, so owner:group is named - newsyslog runs as root and would
# otherwise leave the replacement root-owned, and the agent could not write it.
#
# logfilename                                       owner:group    mode count size(KB) when flags
/Users/schretzi/Library/Logs/container-autostart.log      schretzi:staff  644  5    5120     *    NJ
/Users/schretzi/Library/Logs/container-autostart.err.log  schretzi:staff  644  5    5120     *    NJ
