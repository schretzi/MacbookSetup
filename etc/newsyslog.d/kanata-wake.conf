# kanata-wake - LaunchDaemon com.schretzi.kanata-wake
#
# sleepwatcher runs continuously (KeepAlive) and only ever prints its own
# startup banner plus one line per wake from kanata_wake_refresh.sh - small
# and slow-growing, but still rotated so it never grows unbounded.
#
# logfilename                        owner:group  mode count size(KB) when flags
/Library/Logs/kanata-wake.log        root:wheel   644  5    5120     *    NJ
/Library/Logs/kanata-wake.err.log    root:wheel   644  5    5120     *    NJ
