# Rotates kanata's LaunchDaemon logs by size so they never grow unbounded.
# macOS's built-in newsyslog LaunchDaemon (com.apple.newsyslog) checks every
# file under /etc/newsyslog.d/*.conf hourly (see its CalendarInterval) and
# rotates any that exceed the size below - no cron/manual truncation needed.
#
# N: no process to signal. Without it every rotation SIGHUPs syslogd, which
#    has nothing to do with kanata.
# J: bzip2 the archive.
#
# KNOWN CAVEAT - the rename trap.
# newsyslog rotates by rename() and has no copy-truncate mode; launchd does
# not reopen StandardOutPath. kanata is a resident third-party binary that
# holds its fd, so after a rotation it keeps writing into the renamed archive
# while the new kanata.log stays empty. We cannot fix that in kanata.
#
# What keeps it survivable: com.schretzi.kanata-wake kickstarts the daemon on
# every system wake, which hands it fresh fds. The blind window is therefore
# bounded by the next sleep/wake cycle, not open-ended. DO NOT "fix" the wake
# watcher away - it is load-bearing here as well as for device re-grabbing.
#
# Why this matters more than it used to: these logs used to live in /tmp,
# which macOS clears at boot, so rotation effectively never fired. In
# /Library/Logs it will - roughly every other day, since kanata prints
# "virtual_hid_keyboard_ready true" about once a second (~2.7 MB/day, and
# >99% of the volume). --quiet does not help: that line is a raw println!,
# not a log macro, so --quiet would drop the ~130 lines per boot worth
# reading and keep all the noise. Worth an upstream issue.
#
# logfilename                   [owner:group]  mode  count  size(KB)  when  flags
/Library/Logs/kanata.log        root:wheel     644   5      5120      *     NJ
/Library/Logs/kanata.err.log    root:wheel     644   5      5120      *     NJ
