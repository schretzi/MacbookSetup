# localhost-alias - LaunchDaemon com.schretzi.localhost-alias
#
# Safe with plain launchd capture: runs once at boot and exits.
#
# logfilename                        owner:group  mode count size(KB) when flags
/Library/Logs/localhost-alias.log      root:wheel   644  3    1024     *    NJ
/Library/Logs/localhost-alias.err.log  root:wheel   644  3    1024     *    NJ
