# lsrules - LaunchAgent com.schretzi.lsrules
#
# lsrules.log is written by the process itself (internal/logfile), which
# re-stats its path and reopens after the rename below. .err.log is launchd's
# stderr capture and only ever receives panics.
#
# One line per request, and Little Snitch refreshes a subscription once a day,
# so the size threshold realistically never fires. It is here so that stays a
# measurement rather than an assumption.
#
# logfilename                              owner:group     mode count size(KB) when flags
/Users/schretzi/Library/Logs/lsrules.log      schretzi:staff  600  5    1024     *    NJ
/Users/schretzi/Library/Logs/lsrules.err.log  schretzi:staff  600  5    1024     *    NJ
