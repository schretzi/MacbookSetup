# macswitcher - LaunchAgent com.schretzi.macswitcher
#
# macswitcher.log carries alpaca's output, piped through internal/logfile by
# `macswitcher proxy run` so it reopens after the rename below. Before that
# it was launchd's raw StandardOutPath and had reached 3.3 MB unrotated.
#
# macswitcher-switch.log is the transcript of every context switch, appended
# by `macswitcher switch` itself. It is exempt from the rename trap for a
# different reason than macswitcher.log: not a reopening writer, but a
# short-lived process. `switch` opens the file, appends one block and exits,
# so it never holds an fd across a rotation.
#
# It gets a larger size and a higher count than the others: a switch
# transcript is ~4 KB, this is the only record of what a failed switch did,
# and it is what you reach for days later when the pattern is what matters.
# 10 x 10 MB compressed is a rounding error against keeping that history.
#
# NOT rotated here: ~/Library/Logs/macswitcher-snapshots/. newsyslog rotates
# files, not directories, so `macswitcher snapshot` prunes its own output to
# the 20 most recent runs.
#
# logfilename                                  owner:group     mode count size(KB) when flags
/Users/schretzi/Library/Logs/macswitcher.log         schretzi:staff  600  5    5120     *    NJ
/Users/schretzi/Library/Logs/macswitcher.err.log     schretzi:staff  600  5    5120     *    NJ
/Users/schretzi/Library/Logs/macswitcher-switch.log  schretzi:staff  600  10   10240    *    NJ
