# notes-sync - LaunchAgent com.schretzi.notes-sync
#
# Safe with plain launchd capture: the job runs every few minutes and exits,
# so it reopens both files on every launch and never holds an fd across a
# rotation.
#
# logfilename                                  owner:group     mode count size(KB) when flags
/Users/schretzi/Library/Logs/notes-sync.log      schretzi:staff  600  5    2048     *    NJ
/Users/schretzi/Library/Logs/notes-sync.err.log  schretzi:staff  600  5    2048     *    NJ
