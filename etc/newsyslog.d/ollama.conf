# ollama - LaunchAgent com.schretzi.ollama
#
# Plain launchd capture with the N flag, and that is a deliberate reading of
# the rename problem in CONVENTIONS.md 3 rather than an oversight.
#
# ollama is long-running while it runs, holds the fd launchd handed it, and
# has no reopen-on-signal path - so a rotation mid-session would leave it
# writing into the renamed inode. What makes that acceptable is the job's
# shape: RunAtLoad is false, so it is started by hand for a session and
# stopped again, and every kickstart opens both files afresh. It behaves like
# the short-lived jobs the conventions call out as safe, not like privoxy.
#
# Signalling instead (privoxy's answer) is not available here: without
# KeepAlive nothing would bring it back, so rotation would silently stop the
# server mid-request. Losing a few lines of a server log once per 5 MB is the
# cheaper failure.
#
# A user's files, so owner:group is named - newsyslog runs as root and would
# otherwise leave the replacement root-owned, and the agent could not write it.
#
# logfilename                                 owner:group     mode count size(KB) when flags
/Users/schretzi/Library/Logs/ollama.log      schretzi:staff  644  5    5120     *    NJ
/Users/schretzi/Library/Logs/ollama.err.log  schretzi:staff  644  5    5120     *    NJ
