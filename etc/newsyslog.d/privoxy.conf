# privoxy - LaunchAgent com.schretzi.privoxy
#
# One log, not two, and it is launchd's StandardErrorPath: privoxy logs
# everything to stderr and its own `logfile` directive works only when it
# daemonises (loadcfg.c:1508), which it cannot do under launchd. The plist
# says the same thing at more length.
#
# So this is the rename problem from CONVENTIONS.md 3 again - privoxy holds
# the fd launchd gave it and its reopen-on-SIGHUP path is dead in foreground
# mode. Unlike corp-vpn, though, it does not have to be accepted: the fields
# after the flags name privoxy's pidfile (written even with --no-daemon,
# jcc.c:5917) and signal 15, so newsyslog renames the log and then stops the
# process. KeepAlive in the plist restarts it within a second, against the
# new file. In-flight requests through the proxy are dropped at that moment;
# at block-only logging the 5 MB threshold is reached rarely enough for that
# to be the right trade.
#
# NOT the N flag: N means "no process to signal", and here there is one - it
# is the signal that makes rotation work at all.
#
# logfilename                            owner:group     mode count size(KB) when flags pidfile                                          sig
/Users/schretzi/Library/Logs/privoxy.log  schretzi:staff  600  5    5120     *    J     /Users/schretzi/.local/state/privoxy/privoxy.pid  15
