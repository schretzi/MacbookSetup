# vmnet-nat-refresh - LaunchDaemon com.schretzi.vmnet-nat-refresh
#
# Safe with plain launchd capture: WatchPaths/StartInterval job that exits
# after each run, so it reopens both files on every launch.
#
# logfilename                          owner:group  mode count size(KB) when flags
/Library/Logs/vmnet-nat-refresh.log      root:wheel   644  5    5120     *    NJ
/Library/Logs/vmnet-nat-refresh.err.log  root:wheel   644  5    5120     *    NJ
